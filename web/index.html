<style>
/* Design tokens: Orca-style neutral palette with status hues only (orca-ui-spec.md section 2).
   The theme follows data-theme on <html>: system (default), light or dark. */
:root {
  color-scheme: light;
  --bg:#ffffff; --fg:#0a0a0a;
  --panel:#f5f5f5; --panel-fg:#0a0a0a; --panel-accent:#eaeaea;
  --card:#ffffff; --popover:#ffffff;
  --muted:#f5f5f5; --muted-fg:#696969;
  --accent:#f5f5f5; --accent-fg:#171717;
  --primary:#171717; --primary-fg:#fafafa;
  --border:#e5e5e5; --input:#e5e5e5; --ring:#a1a1a1;
  --floating:rgba(255,255,255,.82);
  --overlay:rgba(0,0,0,.55);
  --link:#0969da;
  --danger:#e40014; --danger-fg:#ffffff;
  --success:#147638; --warning:#ca8a04; --info:#0969da; --review:#8250df;
  --st-progress:#d4a300; --st-review:#16a34a; --st-done:#16a34a; --st-todo:#a3a3a3;
  --success-bg:color-mix(in srgb,var(--success) 10%,transparent);
  --success-border:color-mix(in srgb,var(--success) 25%,transparent);
  --warning-bg:color-mix(in srgb,var(--warning) 10%,transparent);
  --warning-border:color-mix(in srgb,var(--warning) 25%,transparent);
  --warning-text:color-mix(in srgb,var(--warning) 70%,var(--fg));
  --danger-bg:color-mix(in srgb,var(--danger) 10%,transparent);
  --danger-border:color-mix(in srgb,var(--danger) 25%,transparent);
  --info-bg:color-mix(in srgb,var(--info) 10%,transparent);
  --review-bg:color-mix(in srgb,var(--review) 10%,transparent);
  --hover:color-mix(in srgb,var(--fg) 4%,transparent);
  --selected:color-mix(in srgb,var(--fg) 8%,transparent);
  --font-ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"Cascadia Mono","Cascadia Code",Consolas,ui-monospace,monospace;
  --text-3xs:10px; --text-2xs:11px; --text-xs:12px; --text-sm:13px; --text-base:14px;
  --text-lg:16px; --text-xl:20px; --text-2xl:24px; --text-hero:30px;
  --lh-3xs:14px; --lh-2xs:16px; --lh-xs:16px; --lh-sm:20px; --lh-base:20px;
  --tracking:.01em;
  --s-1:4px; --s-1-5:6px; --s-2:8px; --s-2-5:10px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px; --s-8:32px;
  --r-chip:4px; --r-sm:6px; --r-md:8px; --r-lg:10px; --r-menu:11px; --r-xl:14px; --r-full:999px;
  --shadow-xs:0 1px 2px rgba(0,0,0,.05);
  --shadow-card:0 1px 2px rgba(0,0,0,.06);
  --shadow-menu:0 6px 16px rgba(0,0,0,.14), inset 0 1px 0 rgba(255,255,255,.6);
  --shadow-floating:0 10px 24px rgba(0,0,0,.18);
  --shadow-dialog:0 20px 60px rgba(0,0,0,.28);
  --focus-ring:0 0 0 3px color-mix(in srgb,var(--ring) 50%,transparent);
  --dur-fast:100ms; --dur:150ms; --dur-slow:200ms;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-in:cubic-bezier(.7,0,.84,0);
  --header-h:48px; --statusbar-h:24px; --content-max:784px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:#0a0a0a; --fg:#f0f0f0;
  --panel:#1c1c1c; --panel-fg:#f0f0f0; --panel-accent:#2e2e2e;
  --card:#171717; --popover:#171717;
  --muted:#262626; --muted-fg:#acacac;
  --accent:#2e2e2e; --accent-fg:#f0f0f0;
  --primary:#e5e5e5; --primary-fg:#171717;
  --border:rgba(255,255,255,.07); --input:rgba(255,255,255,.15); --ring:#737373;
  --floating:rgba(0,0,0,.72); --overlay:rgba(0,0,0,.6);
  --link:#4493f8;
  --danger:#ff6568; --danger-fg:#450a0a;
  --success:#86efac; --warning:#eab308; --info:#4493f8; --review:#ab7df8;
  --st-done:#4ade80; --st-todo:#737373;
  --warning-text:var(--warning);
  --hover:color-mix(in srgb,var(--fg) 5%,transparent);
  --selected:color-mix(in srgb,var(--fg) 10%,transparent);
  --shadow-menu:0 16px 34px rgba(0,0,0,.40), inset 0 0 0 1px rgba(255,255,255,.06);
  --shadow-floating:0 10px 24px rgba(0,0,0,.5);
  --shadow-dialog:0 24px 72px rgba(0,0,0,.55);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="dark"]) {
  color-scheme: dark;
  --bg:#0a0a0a; --fg:#f0f0f0;
  --panel:#1c1c1c; --panel-fg:#f0f0f0; --panel-accent:#2e2e2e;
  --card:#171717; --popover:#171717;
  --muted:#262626; --muted-fg:#acacac;
  --accent:#2e2e2e; --accent-fg:#f0f0f0;
  --primary:#e5e5e5; --primary-fg:#171717;
  --border:rgba(255,255,255,.07); --input:rgba(255,255,255,.15); --ring:#737373;
  --floating:rgba(0,0,0,.72); --overlay:rgba(0,0,0,.6);
  --link:#4493f8;
  --danger:#ff6568; --danger-fg:#450a0a;
  --success:#86efac; --warning:#eab308; --info:#4493f8; --review:#ab7df8;
  --st-done:#4ade80; --st-todo:#737373;
  --warning-text:var(--warning);
  --hover:color-mix(in srgb,var(--fg) 5%,transparent);
  --selected:color-mix(in srgb,var(--fg) 10%,transparent);
  --shadow-menu:0 16px 34px rgba(0,0,0,.40), inset 0 0 0 1px rgba(255,255,255,.06);
  --shadow-floating:0 10px 24px rgba(0,0,0,.5);
  --shadow-dialog:0 24px 72px rgba(0,0,0,.55);
  }
}
.app-logo { display: inline-grid; width: 24px; height: 24px; flex-shrink: 0; }
.app-logo img { grid-area: 1 / 1; width: 100%; height: 100%; }
.app-logo .app-logo-dark { display: none; }
:root[data-theme="dark"] .app-logo-light { display: none; }
:root[data-theme="dark"] .app-logo-dark { display: block; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="dark"]) .app-logo-light { display: none; }
  :root:not([data-theme="light"]):not([data-theme="dark"]) .app-logo-dark { display: block; }
}
/* Legacy names used by the board, list, timeline and summary views map onto the tokens above,
   so those views take the new palette without a layout rewrite. */
:root {
  --ds-font-family-body: var(--font-ui);
  --ds-font-family-code: var(--font-mono);
  --ds-font-weight-heading: 600;
  --ds-surface: var(--bg);
  --ds-surface-sunken: var(--panel);
  --ds-surface-container: var(--muted);
  --ds-surface-raised: var(--card);
  --ds-surface-raised-hovered: color-mix(in srgb,var(--fg) 3%,var(--card));
  --ds-text: var(--fg);
  --ds-text-subtle: color-mix(in srgb,var(--fg) 72%,var(--muted-fg));
  --ds-text-subtlest: var(--muted-fg);
  --ds-text-inverse: var(--primary-fg);
  --ds-text-disabled: color-mix(in srgb,var(--fg) 38%,transparent);
  --ds-link: var(--link);
  --ds-background-brand-bold: var(--primary);
  --ds-background-brand-bold-hovered: color-mix(in srgb,var(--primary) 90%,var(--bg));
  --ds-background-brand-bold-pressed: color-mix(in srgb,var(--primary) 80%,var(--bg));
  --ds-background-brand-subtlest: var(--selected);
  --ds-background-neutral: color-mix(in srgb,var(--fg) 6%,transparent);
  --ds-background-neutral-hovered: color-mix(in srgb,var(--fg) 10%,transparent);
  --ds-background-neutral-pressed: color-mix(in srgb,var(--fg) 14%,transparent);
  --ds-background-input: var(--bg);
  --ds-background-input-hovered: var(--bg);
  --ds-text-information: var(--info);
  --ds-background-information: var(--info-bg);
  --ds-text-success: var(--success);
  --ds-background-success: var(--success-bg);
  --ds-text-warning: var(--warning-text);
  --ds-background-warning: var(--warning-bg);
  --ds-text-danger: var(--danger);
  --ds-background-danger: var(--danger-bg);
  --ds-text-discovery: var(--review);
  --ds-background-discovery: var(--review-bg);
  --ds-border: var(--border);
  --ds-border-input: color-mix(in srgb,var(--fg) 22%,transparent);
  --ds-border-focused: var(--ring);
  --ds-shadow-raised: 0 0 0 1px var(--border), var(--shadow-card);
  --ds-space-025: 2px; --ds-space-050: 4px; --ds-space-075: 6px; --ds-space-100: 8px; --ds-space-150: 12px;
  --ds-space-200: 16px; --ds-space-250: 20px; --ds-space-300: 24px; --ds-space-400: 32px;
  --ds-radius-small: var(--r-sm); --ds-radius-medium: var(--r-md); --ds-radius-large: var(--r-lg);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 400 var(--text-sm)/var(--lh-sm) var(--font-ui); letter-spacing: var(--tracking); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
button, select { cursor: pointer; }
button:disabled, select:disabled { cursor: default; color: var(--ds-text-disabled); }
a { color: var(--link); }
* { scrollbar-width: thin; scrollbar-color: color-mix(in srgb,var(--muted-fg) 28%,transparent) transparent; }
:focus-visible { outline: none; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
  outline: none; box-shadow: var(--focus-ring); border-color: var(--ring);
}
.mono, time, .id { font-family: var(--ds-font-family-code); font-variant-numeric: tabular-nums; }
.app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
.appbar {
  display: flex; align-items: center; gap: var(--ds-space-300); height: 48px; flex-shrink: 0;
  padding: 0 var(--ds-space-200); border-bottom: 1px solid var(--ds-border);
}
.nav { display: flex; align-self: stretch; gap: var(--ds-space-200); }
.item { position: relative; display: flex; align-items: center; gap: var(--ds-space-100); border: 0; background: transparent; padding: 0 var(--ds-space-050); color: var(--ds-text-subtle); font-weight: 500; white-space: nowrap; }
.item:hover { color: var(--ds-link); }
.item.on { color: var(--ds-link); }
.item.on::after { position: absolute; bottom: -1px; left: 0; right: 0; height: 3px; background: var(--ds-link); border-radius: 2px 2px 0 0; content: ""; }
.badge { padding: 0 var(--ds-space-050); border-radius: var(--ds-radius-small); background: var(--ds-background-neutral); font-size: 12px; line-height: 16px; font-variant-numeric: tabular-nums; }
.save-state { margin-left: auto; font-size: 12px; color: var(--ds-text-subtle); }
.connection { font-size: 12px; color: var(--ds-text-subtlest); white-space: nowrap; }
.live { width: 6px; height: 6px; border-radius: 50%; background: var(--ds-text-success); flex-shrink: 0; }
.live.off { background: var(--ds-text-warning); }
#upd { font-size: 12px; color: var(--ds-text-subtlest); }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; flex: 1; }
.top { display: flex; align-items: center; flex-wrap: wrap; gap: var(--ds-space-150); padding: var(--ds-space-300); background: var(--ds-surface); flex-shrink: 0; }
.top h1 { margin: 0; font-size: 24px; line-height: 28px; font-weight: var(--ds-font-weight-heading); overflow-wrap: anywhere; }
.sub { color: var(--ds-text-subtlest); font-size: 12px; }
.search { margin-left: auto; width: min(300px, 32vw); min-height: 32px; border: 1px solid var(--ds-border-input); border-radius: var(--ds-radius-small); padding: 5px var(--ds-space-100); background: var(--ds-background-input); }
.search::placeholder { color: var(--ds-text-subtlest); }
.search:hover { background: var(--ds-background-input-hovered); }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 32px; padding: 5px var(--ds-space-150); border: 1px solid transparent; border-radius: var(--ds-radius-small); background: var(--ds-background-neutral); font-size: 14px; font-weight: 500; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--ds-background-neutral-hovered); }
.btn:active { background: var(--ds-background-neutral-pressed); }
.view { overflow: auto; overscroll-behavior: contain; flex: 1; min-height: 0; padding: 0 var(--ds-space-300) var(--ds-space-300); background: var(--ds-surface); scrollbar-color: var(--ds-border-input) transparent; }
.view.detail { padding-top: var(--ds-space-300); }
.error { padding: var(--ds-space-100) var(--ds-space-300); background: var(--ds-background-danger); color: var(--ds-text-danger); font-size: 12px; overflow-wrap: anywhere; }
.board { display: grid; grid-template-columns: repeat(5, 280px); gap: var(--ds-space-150); width: max-content; min-width: 100%; min-height: 100%; align-items: stretch; }
.column { min-width: 0; min-height: 240px; padding: var(--ds-space-100); border-radius: var(--ds-radius-medium); background: var(--ds-surface-sunken); }
.column h2 { display: flex; align-items: center; gap: var(--ds-space-100); position: sticky; top: 0; z-index: 1; min-height: 36px; margin: 0 0 var(--ds-space-100); padding: var(--ds-space-100) var(--ds-space-050); background: var(--ds-surface-sunken); color: var(--ds-text-subtle); font-size: 14px; line-height: 20px; font-weight: var(--ds-font-weight-heading); text-transform: uppercase; }
.column h2 span { padding: 0 var(--ds-space-050); border-radius: var(--ds-radius-small); background: var(--ds-background-neutral); font-family: var(--ds-font-family-code); font-size: 12px; line-height: 16px; font-weight: 400; }
.task-card { position: relative; border: 1px solid transparent; border-radius: var(--ds-radius-large); background: var(--ds-surface-raised); box-shadow: var(--ds-shadow-raised); padding: var(--ds-space-150); margin-bottom: var(--ds-space-100); cursor: pointer; }
.task-card:hover { background: var(--ds-surface-raised-hovered); }
.task-card:focus-within { outline: 2px solid var(--ds-border-focused); outline-offset: 2px; }
.task-heading { display: flex; align-items: baseline; justify-content: space-between; gap: var(--ds-space-100); margin-bottom: var(--ds-space-100); }
.task-repo { min-width: 0; color: var(--ds-text-subtle); font-size: 12px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task-edited { font-size: 12px; line-height: 16px; color: var(--ds-text-subtlest); white-space: nowrap; flex-shrink: 0; }
.task-title { display: block; width: 100%; border: 0; background: none; text-align: left; padding: 0; font-size: 14px; line-height: 20px; font-weight: 500; overflow-wrap: anywhere; }
.task-next { color: var(--ds-text-subtle); margin: var(--ds-space-100) 0; font-size: 12px; line-height: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.task-status { display: flex; align-items: center; gap: var(--ds-space-050); flex-wrap: wrap; margin-top: var(--ds-space-100); }
.stage-detail { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 12px; line-height: 16px; color: var(--ds-text-subtle); margin-top: var(--ds-space-050); overflow-wrap: anywhere; }
.task-progress { display: flex; align-items: center; gap: var(--ds-space-100); margin-top: var(--ds-space-150); font-size: 12px; color: var(--ds-text-subtlest); }
.task-progress .bar { flex: 1; min-width: 32px; }
.task-footer { display: flex; align-items: center; justify-content: flex-end; margin-top: var(--ds-space-150); font-size: 12px; color: var(--ds-text-subtle); }
.assignee { display: flex; align-items: center; gap: var(--ds-space-100); min-width: 0; }
.assignee .owner { max-width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.av { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; color: #FFFFFF; font-size: 12px; line-height: 16px; font-weight: 500; flex-shrink: 0; }
.empty-column { padding: var(--ds-space-150) var(--ds-space-050); color: var(--ds-text-subtlest); font-size: 12px; }
.empty { color: var(--ds-text-subtlest); padding: var(--ds-space-400) var(--ds-space-200); text-align: center; }
.pill { display: inline-flex; align-items: center; max-width: 100%; padding: 2px var(--ds-space-075); border-radius: var(--ds-radius-small); font-size: 12px; line-height: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; overflow-wrap: anywhere; }
.t-doing, .t-test { background: var(--ds-background-information); color: var(--ds-text-information); }
.t-ok { background: var(--ds-background-success); color: var(--ds-text-success); }
.t-review { background: var(--ds-background-discovery); color: var(--ds-text-discovery); }
.t-pending { background: var(--ds-background-warning); color: var(--ds-text-warning); }
.t-bad { background: var(--ds-background-danger); color: var(--ds-text-danger); }
.t-idle { background: var(--ds-background-neutral-pressed); color: var(--ds-text); }
.bar { height: 4px; background: var(--ds-background-neutral-pressed); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ds-link); }
.pipe { display: inline-flex; gap: 3px; }
.pipe i { width: 12px; height: 3px; border-radius: 1px; background: var(--ds-background-neutral-pressed); }
.pipe i.p { background: var(--ds-link); opacity: .4; }
.pipe i.c { background: var(--ds-link); }
.pr { font-weight: 500; text-decoration: none; }
.pr:hover { text-decoration: underline; }
.chead { display: grid; gap: var(--ds-space-150); max-width: 1200px; width: 100%; margin: auto; }
.chead .t { display: flex; align-items: center; gap: var(--ds-space-150); flex-wrap: wrap; }
.chead .t h1 { font-size: 24px; line-height: 28px; max-width: 560px; }
.chead .goal { font-size: 14px; line-height: 20px; max-width: 900px; }
.chead .meta { display: flex; align-items: center; gap: var(--ds-space-150); flex-wrap: wrap; font-size: 12px; color: var(--ds-text-subtle); }
.chead .stage-detail { max-width: 540px; }
.tabs { display: flex; gap: var(--ds-space-200); padding: 0 var(--ds-space-300); border-bottom: 1px solid var(--ds-border); background: var(--ds-surface); }
.tab { position: relative; border: 0; background: none; min-height: 40px; padding: var(--ds-space-100) var(--ds-space-050); font-size: 14px; font-weight: 500; color: var(--ds-text-subtle); border-bottom: 3px solid transparent; }
.tab.on { color: var(--ds-link); border-bottom-color: var(--ds-link); }
.tab span { margin-left: var(--ds-space-050); font-size: 12px; font-weight: 400; color: var(--ds-text-subtlest); }
.tabs .tab:first-child { padding-left: 0; }
.detail > * { max-width: none; margin-left: 0; margin-right: 0; }
.pin { padding: var(--ds-space-150); margin-bottom: var(--ds-space-300); background: var(--ds-surface-sunken); border-radius: var(--ds-radius-medium); font-size: 14px; }
.pin b { margin-right: var(--ds-space-150); color: var(--ds-text-subtle); font-size: 12px; text-transform: uppercase; }
.ms { margin-bottom: var(--ds-space-300); border-bottom: 1px solid var(--ds-border); padding-bottom: var(--ds-space-200); }
.ms-h { display: flex; align-items: center; gap: var(--ds-space-100); flex-wrap: wrap; font-size: 14px; }
.ms-h b { font-weight: var(--ds-font-weight-heading); }
.ms-h .id { color: var(--ds-text-subtle); font-size: 12px; }
.ms-h .c { margin-left: auto; color: var(--ds-text-subtlest); font-size: 12px; }
.ms-h .bar { width: 100px; }
.sum { margin: var(--ds-space-100) 0; padding: var(--ds-space-100) var(--ds-space-150); background: var(--ds-surface-sunken); font-size: 14px; border-radius: var(--ds-radius-small); }
.st { display: grid; grid-template-columns: 16px 1fr auto; gap: var(--ds-space-100); padding: var(--ds-space-100) 0; border-top: 1px solid var(--ds-border); font-size: 14px; }
.st:first-of-type { border-top: 0; }
.box { display: grid; place-items: center; width: 16px; height: 16px; border: 1px solid var(--ds-border-input); border-radius: var(--ds-radius-small); font-size: 12px; margin-top: 2px; }
.s-done .box { background: var(--ds-background-success); border-color: var(--ds-text-success); color: var(--ds-text-success); }
.s-done .tx { color: var(--ds-text-subtle); }
.s-doing .box { border-color: var(--ds-link); color: var(--ds-link); }
.s-blocked .box, .s-blocked .tx { color: var(--ds-text-danger); }
.tag { height: fit-content; padding: 0 var(--ds-space-050); border-radius: var(--ds-radius-small); background: var(--ds-surface-container); color: var(--ds-text-subtle); font-size: 12px; white-space: nowrap; }
.list .li { display: grid; grid-template-columns: 120px 1fr; gap: var(--ds-space-200); padding: var(--ds-space-150) 0; border-bottom: 1px solid var(--ds-border); font-size: 14px; }
.li time, .li .a { color: var(--ds-text-subtle); }
.li .a::before { content: "↳ "; }
.feed { display: flex; flex-direction: column; }
.day { margin: var(--ds-space-200) 0 var(--ds-space-100); padding-bottom: var(--ds-space-050); border-bottom: 1px solid var(--ds-border); font-size: 12px; color: var(--ds-text-subtlest); }
.msg { display: grid; grid-template-columns: 24px 1fr; gap: var(--ds-space-150); padding: var(--ds-space-100) 0; }
.mh { display: flex; align-items: baseline; gap: var(--ds-space-100); flex-wrap: wrap; font-size: 14px; }
.mh time { font-size: 12px; color: var(--ds-text-subtlest); }
.mb { font-size: 14px; margin-top: var(--ds-space-050); overflow-wrap: anywhere; }
.mb .x { color: var(--ds-text-subtle); }
.blk { border-left: 2px solid var(--ds-border); padding: var(--ds-space-050) var(--ds-space-150); }
.blk .k { margin-bottom: var(--ds-space-050); font-size: 12px; font-weight: var(--ds-font-weight-heading); color: var(--ds-text-subtle); }
.k-blocked, .k-stale { border-color: var(--ds-text-danger); }
.k-decision { border-color: var(--ds-text-discovery); }
.k-waiting { border-color: var(--ds-text-warning); }
.ok { color: var(--ds-text-success); }

  .appbar { height: auto; min-height: 48px; flex-wrap: wrap; gap: var(--ds-space-150); padding: 0 var(--ds-space-150); }
  .nav { min-height: 48px; gap: var(--ds-space-100); }
  .save-state { font-size: 12px; }
  .connection { margin-left: auto; }
  .save-state:empty { display: none; }
  #upd { display: none; }
  .top { padding: var(--ds-space-200) var(--ds-space-150); gap: var(--ds-space-100); }
  .top h1, .chead .t h1 { font-size: 20px; line-height: 24px; }
  .search { width: min(280px, 100%); flex: 1 1 180px; }
  .chead .search { margin-left: 0; }
  .view { padding-left: var(--ds-space-150); padding-right: var(--ds-space-150); }
  .tabs { padding: 0 var(--ds-space-150); gap: var(--ds-space-100); overflow-x: auto; }
  .tab { flex-shrink: 0; }
  .list .li { grid-template-columns: 1fr; gap: var(--ds-space-050); }
}

/* ---------- Shared components (orca-ui-spec.md section 3) ---------- */
.appbar { background: var(--bg); }
.item:hover, .item.on { color: var(--fg); }
.item.on::after { background: var(--fg); }
.tab.on { color: var(--fg); border-bottom-color: var(--fg); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); min-height: 32px; padding: 0 var(--s-3); border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--bg); color: var(--fg); box-shadow: var(--shadow-xs); font-size: var(--text-base); line-height: var(--lh-base); font-weight: 500; text-decoration: none; white-space: nowrap; transition: background-color var(--dur), border-color var(--dur), opacity var(--dur); }
.btn:hover { background: var(--accent); }
.btn:active { background: var(--selected); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .5; cursor: default; color: var(--fg); }
.btn svg { width: 16px; height: 16px; flex-shrink: 0; }
.btn-primary { border-color: transparent; background: var(--primary); color: var(--primary-fg); }
.btn-primary:hover { background: color-mix(in srgb,var(--primary) 90%,var(--bg)); }
.btn-primary:active { background: color-mix(in srgb,var(--primary) 80%,var(--bg)); }
.btn-primary:disabled { background: var(--primary); color: var(--primary-fg); }
.btn-ghost, .btn-subtle { border-color: transparent; background: transparent; box-shadow: none; color: var(--fg); }
.btn-ghost:hover, .btn-subtle:hover { background: var(--accent); color: var(--fg); }
.btn-danger { border-color: transparent; background: var(--danger); color: var(--danger-fg); }
.btn-danger:hover { background: color-mix(in srgb,var(--danger) 88%,var(--bg)); }
.btn-lg { min-height: 36px; padding: 0 var(--s-4); }
.btn-xs { min-height: 24px; padding: 0 var(--s-2); gap: var(--s-1); font-size: var(--text-xs); line-height: var(--lh-xs); }
.btn-xs svg { width: 14px; height: 14px; }
.btn-block { width: 100%; }
.btn .kbd { margin-left: var(--s-1); }
.btn-primary .kbd { border-color: color-mix(in srgb,var(--primary-fg) 25%,transparent); background: color-mix(in srgb,var(--primary-fg) 12%,transparent); color: color-mix(in srgb,var(--primary-fg) 80%,transparent); box-shadow: none; }
.link-btn { display: inline-flex; align-items: center; gap: var(--s-1); width: fit-content; padding: 2px 0; border: 0; border-radius: var(--r-chip); background: none; color: var(--fg); font-size: var(--text-sm); font-weight: 500; text-decoration: underline; text-decoration-color: color-mix(in srgb,var(--fg) 30%,transparent); text-underline-offset: 3px; }
.link-btn:hover { text-decoration-color: currentColor; }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid transparent; border-radius: var(--r-sm); background: none; color: var(--muted-fg); flex-shrink: 0; transition: background-color var(--dur), color var(--dur); }
.icon-btn:hover { background: var(--accent); color: var(--fg); }
.icon-btn svg { width: 16px; height: 16px; }
.icon-btn-xs { width: 24px; height: 24px; }
.icon-btn-xs svg { width: 14px; height: 14px; }
.icon-btn.is-confirm { background: var(--danger-bg); color: var(--danger); }
.kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; padding: 0 var(--s-1-5); border: 1px solid color-mix(in srgb,var(--border) 80%,transparent); border-radius: var(--r-chip); background: color-mix(in srgb,var(--muted) 70%,transparent); box-shadow: var(--shadow-xs); color: var(--muted-fg); font: 500 var(--text-2xs)/18px var(--font-ui); letter-spacing: 0; white-space: nowrap; }
.kbd-combo { display: inline-flex; align-items: center; gap: 2px; color: var(--muted-fg); font-size: var(--text-2xs); }
.input, .text-input, .search, .settings-search { min-height: 32px; padding: 0 var(--s-3); border: 1px solid var(--input); border-radius: var(--r-sm); background: var(--bg); color: var(--fg); box-shadow: var(--shadow-xs); font-size: var(--text-sm); transition: border-color var(--dur), box-shadow var(--dur); }
:root[data-theme="dark"] :is(.input,.text-input,.search,.settings-search) { background: color-mix(in srgb,var(--input) 30%,transparent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]):not([data-theme="dark"]) :is(.input,.text-input,.search,.settings-search) { background: color-mix(in srgb,var(--input) 30%,transparent); } }
.input::placeholder, .text-input::placeholder, .search::placeholder, .settings-search::placeholder { color: var(--muted-fg); }
.input[aria-invalid="true"], .text-input[aria-invalid="true"] { border-color: var(--danger); box-shadow: 0 0 0 3px color-mix(in srgb,var(--danger) 20%,transparent); }
.search-field { position: relative; display: flex; align-items: center; }
.search-field > svg { position: absolute; left: 10px; width: 14px; height: 14px; color: var(--muted-fg); pointer-events: none; }
.search-field > .input { width: 100%; padding-left: 30px; padding-right: 34px; }
.search-field > .kbd { position: absolute; right: 7px; pointer-events: none; }
.search-field > .input:not(:placeholder-shown) + .kbd { display: none; }
.switch { appearance: none; -webkit-appearance: none; position: relative; width: 36px; height: 20px; margin: 0; flex-shrink: 0; border: 1px solid transparent; border-radius: var(--r-full); background: var(--ds-border-input); transition: background-color var(--dur); cursor: pointer; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform var(--dur) var(--ease-out); }
.switch:checked { background: var(--primary); }
.switch:checked::after { transform: translateX(16px); background: var(--primary-fg); }
.switch:disabled { opacity: .5; cursor: default; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--r-lg); background: var(--muted); }
.seg button { min-height: 28px; padding: 0 var(--s-3); border: 0; border-radius: var(--r-sm); background: transparent; color: var(--muted-fg); font-size: var(--text-sm); font-weight: 500; transition: background-color var(--dur), color var(--dur); }
.seg button:hover { color: var(--fg); }
.seg button[aria-checked="true"] { background: var(--bg); color: var(--fg); box-shadow: var(--shadow-xs), 0 0 0 1px var(--border); }
.card { border: 1px solid var(--border); border-radius: var(--r-xl); background: var(--card); }
.pill { gap: var(--s-1-5); padding: 2px var(--s-2); border-radius: var(--r-full); font-size: var(--text-2xs); line-height: var(--lh-2xs); font-weight: 500; text-transform: none; letter-spacing: 0; }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.mono, time, .id, code { font-family: var(--font-mono); }
code { font-size: 12px; padding: 1px 4px; border-radius: var(--r-chip); background: var(--muted); }
.tag.is-danger { background: var(--danger-bg); color: var(--danger); }
.tag.is-off { background: var(--muted); color: var(--muted-fg); }

/* ---------- Banners ---------- */
.banner { display: flex; align-items: flex-start; gap: var(--s-3); padding: var(--s-2) var(--s-4); border-bottom: 1px solid var(--border); font-size: var(--text-sm); line-height: var(--lh-sm); overflow-wrap: anywhere; }
.banner > svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; }
.banner-danger { background: var(--danger-bg); border-bottom-color: var(--danger-border); }
.banner-danger > svg { color: var(--danger); }
.banner-warning { background: var(--warning-bg); border-bottom-color: var(--warning-border); }
.banner-warning > svg { color: var(--warning-text); }
.banner-text { display: grid; gap: 2px; min-width: 0; flex: 1; }
.banner-text strong { font-weight: 600; color: var(--fg); }
.banner-text span { color: var(--muted-fg); font-size: var(--text-xs); line-height: var(--lh-xs); }
.banner-warning .banner-text span { color: var(--fg); font-size: var(--text-sm); line-height: var(--lh-sm); }
.banner-actions { display: flex; align-items: center; gap: var(--s-2); flex-shrink: 0; }
.banner-raw { margin: var(--s-1) 0 0; padding: var(--s-2) var(--s-3); border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--bg); color: var(--fg); font: 12px/18px var(--font-mono); white-space: pre-wrap; max-height: 160px; overflow: auto; }

/* ---------- Status bar and update card ---------- */
.statusbar { display: flex; align-items: center; gap: var(--s-4); height: var(--statusbar-h); flex-shrink: 0; padding: 0 var(--s-3); border-top: 1px solid var(--border); background: var(--panel); color: var(--muted-fg); font-size: var(--text-xs); line-height: var(--lh-xs); white-space: nowrap; overflow: hidden; position: relative; z-index: 45; }
.statusbar .grow { flex: 1; }
.status-seg { display: inline-flex; align-items: center; gap: var(--s-1-5); height: 20px; padding: 0 var(--s-1-5); margin: 0 calc(var(--s-1-5) * -1); border: 0; border-radius: var(--r-chip); background: none; color: inherit; font-size: inherit; font-variant-numeric: tabular-nums; }
button.status-seg:hover { background: var(--hover); color: var(--fg); }
.status-seg svg { width: 12px; height: 12px; }
.status-seg.is-update { color: var(--fg); font-weight: 500; }
.status-seg.is-failed { color: var(--warning-text); }
.live { width: 6px; height: 6px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
.live.off { background: var(--warning); }
#app-version { font-family: var(--font-mono); }
.update-card { position: fixed; right: 16px; bottom: calc(var(--statusbar-h) + 16px); z-index: 50; width: min(360px, calc(100vw - 32px)); padding: var(--s-4); border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--popover); color: var(--fg); box-shadow: var(--shadow-floating); animation: card-in var(--dur-slow) var(--ease-out); }
@keyframes card-in { from { opacity: 0; transform: translateX(16px); } }
.update-card-head { display: flex; align-items: center; gap: var(--s-2); }
.update-card-head > svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--muted-fg); }
.update-card-head > .spin { color: var(--muted-fg); }
.update-card-head strong { flex: 1; min-width: 0; font-size: var(--text-sm); font-weight: 600; }
.update-card-head .icon-btn { margin: -4px -6px -4px 0; }
.update-card p { margin: var(--s-1-5) 0 0; color: var(--muted-fg); font-size: var(--text-xs); line-height: 18px; overflow-wrap: anywhere; }
.update-card .update-card-error { color: var(--fg); }
.update-card details { margin-top: var(--s-2); font-size: var(--text-xs); }
.update-card summary { cursor: pointer; color: var(--muted-fg); width: fit-content; border-radius: var(--r-chip); }
.update-card summary:hover { color: var(--fg); }
.update-notes { margin: var(--s-2) 0 0; max-height: 160px; overflow: auto; padding: var(--s-2) var(--s-3); border-radius: var(--r-sm); background: var(--muted); color: var(--fg); font: 12px/18px var(--font-ui); white-space: pre-wrap; overflow-wrap: anywhere; }
.update-notes.mono { font-family: var(--font-mono); }
.update-card-actions { display: grid; gap: var(--s-1-5); margin-top: var(--s-3); }
.update-card-actions.row { display: flex; justify-content: flex-end; }
.progress-bar { position: relative; height: 6px; margin-top: var(--s-3); border-radius: var(--r-full); background: var(--muted); overflow: hidden; }
.progress-bar i { position: absolute; top: 0; bottom: 0; left: 0; width: 35%; border-radius: inherit; background: color-mix(in srgb,var(--fg) 70%,transparent); animation: indeterminate 1.4s var(--ease-out) infinite; }
@keyframes indeterminate { from { left: -35%; } to { left: 100%; } }

/* ---------- Empty state ---------- */
.empty-state { display: flex; flex-direction: column; align-items: center; max-width: 420px; margin: 0 auto; padding: 48px 16px; text-align: center; }
.empty-icon { display: grid; place-items: center; width: 48px; height: 48px; margin-bottom: var(--s-4); border-radius: var(--r-lg); background: var(--muted); color: var(--muted-fg); }
.empty-icon .app-logo { width: 28px; height: 28px; }
.empty-state h2 { margin: 0; font-size: var(--text-lg); line-height: 24px; font-weight: 600; color: var(--fg); }
.empty-state p { margin: var(--s-1-5) 0 0; color: var(--muted-fg); font-size: var(--text-sm); }
.empty-actions { display: flex; gap: var(--s-2); margin-top: var(--s-5); flex-wrap: wrap; justify-content: center; }
.empty-keys { display: grid; gap: var(--s-2); margin: var(--s-6) 0 0; padding: 0; font-size: var(--text-xs); color: var(--muted-fg); }
.empty-keys div { display: flex; align-items: center; justify-content: space-between; gap: var(--s-6); min-width: 220px; }
.empty-keys dd { margin: 0; }
.empty-keys dt { display: inline-flex; gap: 2px; align-items: center; }

/* ---------- Inline messages ---------- */
.field-msg { display: flex; align-items: flex-start; gap: var(--s-1-5); margin: var(--s-1) 0 0; font-size: var(--text-xs); line-height: var(--lh-xs); overflow-wrap: anywhere; }
.field-msg svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; }
.field-msg.is-error { color: var(--danger); }
.field-msg.is-info { color: var(--info); }
.field-msg.is-success { color: var(--success); }
.callout { display: flex; gap: var(--s-2); margin: var(--s-3) 0 0; padding: var(--s-3) var(--s-4); border: 1px solid var(--border); border-left-width: 3px; border-radius: var(--r-md); font-size: var(--text-sm); overflow-wrap: anywhere; }
.callout svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 3px; }
.callout-warning { border-color: var(--warning-border); border-left-color: var(--warning); background: var(--warning-bg); }
.callout-warning svg { color: var(--warning-text); }
.callout-danger { border-color: var(--danger-border); border-left-color: var(--danger); background: var(--danger-bg); }
.callout-danger svg { color: var(--danger); }
.callout-info { border-color: color-mix(in srgb,var(--info) 25%,transparent); border-left-color: var(--info); background: var(--info-bg); }
.callout-info svg { color: var(--info); }
.saved { color: var(--muted-fg); font-size: var(--text-xs); }

/* ---------- Add project ---------- */
.add-project { display: grid; gap: var(--s-2); margin: var(--s-5) 0 0; }
.option-card { display: flex; align-items: center; gap: var(--s-3); width: 100%; min-height: 64px; padding: var(--s-3) var(--s-4); border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--card); color: var(--fg); text-align: left; transition: background-color var(--dur), border-color var(--dur); }
.option-card:hover { background: var(--hover); }
.option-card:disabled { opacity: .6; cursor: default; color: var(--fg); }
.option-icon { display: grid; place-items: center; width: 36px; height: 36px; border-radius: var(--r-md); background: var(--muted); color: var(--fg); flex-shrink: 0; }
.option-icon svg { width: 18px; height: 18px; }
.option-text { display: grid; gap: 2px; flex: 1; min-width: 0; }
.option-text strong { font-weight: 600; }
.option-text small { color: var(--muted-fg); font-size: var(--text-xs); }

.added-list { list-style: none; margin: var(--s-4) 0 0; padding: 0; }

/* ---------- First-run setup ---------- */

.onboarding-body { flex: 1; min-height: 0; padding: var(--s-6) var(--s-8) var(--s-8); overflow: auto; }

.onboarding-body h1 { margin: 0; font-size: var(--text-hero); line-height: 36px; font-weight: 600; letter-spacing: -.01em; }
.onboarding-lead { max-width: 60ch; margin: var(--s-2) 0 0; color: var(--muted-fg); font-size: var(--text-base); line-height: 22px; }
.feature-list { display: grid; gap: var(--s-4); margin: var(--s-8) 0 0; padding: 0; list-style: none; }
.feature-list li { display: flex; align-items: center; gap: var(--s-3); }
.feature-icon { display: grid; place-items: center; width: 40px; height: 40px; border-radius: var(--r-lg); background: var(--muted); color: var(--fg); flex-shrink: 0; }
.feature-icon svg { width: 18px; height: 18px; }

.onboarding-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); min-height: 65px; padding: var(--s-4) var(--s-8); border-top: 1px solid var(--border); }
.onboarding-nav { display: flex; align-items: center; gap: var(--s-2); }
.setup-confirm { display: flex; align-items: center; gap: var(--s-3); width: 100%; flex-wrap: wrap; }
.setup-confirm .banner-text span { font-size: var(--text-sm); }
.onboarding-body > .card, .onboarding-body > .setting-list { margin-top: var(--s-5); }

/* ---------- Settings ---------- */
.settings { position: fixed; top: 0; left: 0; right: 0; bottom: var(--statusbar-h); z-index: 40; background: var(--bg); }
.settings-shell { display: grid; grid-template-columns: 240px minmax(0,1fr); height: 100%; }
.settings-nav { display: flex; flex-direction: column; gap: 2px; min-height: 0; padding: var(--s-3) var(--s-2); border-right: 1px solid var(--border); background: var(--panel); overflow: auto; }
.settings-back { justify-content: flex-start; align-self: flex-start; min-height: 30px; padding: 0 var(--s-2); margin-bottom: var(--s-2); color: var(--muted-fg); font-size: var(--text-sm); }
.settings-back:hover { color: var(--fg); }
.settings-nav .search-field { margin: 0 var(--s-1) var(--s-2); }
.settings-nav .search-field .input { min-height: 30px; }
.settings-nav-heading { margin: var(--s-3) var(--s-2) var(--s-1); color: var(--muted-fg); font-size: var(--text-2xs); font-weight: 600; }
.settings-nav-group, .settings-nav-projects { display: grid; gap: 1px; }

.settings-nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warning); flex-shrink: 0; }
.settings-nav-empty { margin: var(--s-1) var(--s-2); font-size: var(--text-xs); color: var(--muted-fg); }
.settings-main { overflow: auto; }
.settings-content { max-width: var(--content-max); margin: 0 auto; padding: var(--s-6) var(--s-8) 96px; animation: settings-in 180ms var(--ease-out); }

.settings-head { margin-bottom: var(--s-6); padding-bottom: var(--s-6); border-bottom: 1px solid var(--border); }

.settings-empty { display: grid; gap: var(--s-1); padding: var(--s-6); border: 1px dashed var(--border); border-radius: var(--r-lg); text-align: center; color: var(--muted-fg); font-size: var(--text-sm); }
.settings-empty strong { color: var(--fg); font-weight: 600; }
.settings-empty .link-btn { justify-self: center; margin-top: var(--s-1); }
.project-list { list-style: none; margin: var(--s-4) 0 0; padding: 0; display: grid; gap: var(--s-3); }
.project-card { padding: var(--s-4) var(--s-5); border: 1px solid var(--border); border-radius: var(--r-xl); background: var(--card); }
.project-card.is-disabled .project-title strong { color: var(--muted-fg); }
.project-card.is-missing { border-color: var(--danger-border); }

.project-icon { display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--r-md); background: var(--muted); color: var(--fg); flex-shrink: 0; }
.project-icon svg { width: 16px; height: 16px; }
.project-title { display: grid; min-width: 0; flex: 1; }
.project-title strong { font-weight: 600; overflow-wrap: anywhere; }
.project-title small { font-size: var(--text-2xs); color: var(--muted-fg); overflow-wrap: anywhere; }
.project-toggle { display: inline-flex; align-items: center; gap: var(--s-2); font-size: var(--text-xs); color: var(--muted-fg); cursor: pointer; white-space: nowrap; }

.project-summary.is-error { color: var(--danger); }
.repo-list { list-style: none; margin: var(--s-2-5) 0 0; padding: var(--s-2) var(--s-3); display: grid; grid-template-columns: repeat(auto-fill,minmax(180px,1fr)); gap: var(--s-1) var(--s-4); border-radius: var(--r-md); background: var(--muted); font-size: var(--text-xs); }
.repo-list li { display: flex; justify-content: space-between; gap: var(--s-2); min-width: 0; }

.integration-reminder-state { display: flex; align-items: center; gap: var(--s-2); color: var(--muted-fg); font-size: var(--text-xs); }
.diff-panel { margin-top: var(--s-3); border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg); overflow: hidden; }
.diff-head { display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap; padding: var(--s-2) var(--s-3); border-bottom: 1px solid var(--border); font-size: var(--text-xs); }
.diff-legend { display: inline-flex; gap: var(--s-3); margin-left: auto; color: var(--muted-fg); }
.diff-body { max-height: 320px; overflow: auto; padding: var(--s-1) 0; font: 12px/18px var(--font-mono); }
.diff-line { display: flex; gap: var(--s-2); padding: 0 var(--s-3); white-space: pre-wrap; overflow-wrap: anywhere; }
.diff-line.is-del, .diff-legend .is-del { background: var(--danger-bg); color: var(--danger); }
.diff-line.is-add, .diff-legend .is-add { background: var(--success-bg); color: var(--success); }
.diff-op { width: 10px; flex-shrink: 0; }
.diff-empty { margin: 0; padding: var(--s-2) var(--s-3); color: var(--muted-fg); font-family: var(--font-ui); }
.review-list { display: grid; gap: var(--s-2); margin: var(--s-3) 0 0; padding: var(--s-3) var(--s-4); list-style: none; border: 1px solid var(--border); border-radius: var(--r-lg); font-size: var(--text-xs); }
.review-list li { display: grid; gap: 2px; overflow-wrap: anywhere; }
.setup-check { width: 16px; height: 16px; flex-shrink: 0; accent-color: var(--primary); }

@media (max-width: 760px) {
  .settings-shell { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }

  .onboarding-body h1 { font-size: 24px; line-height: 30px; }
  .setup-progress span { display: none; }
  .paste-row { flex-direction: column; }

}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }

  .progress-bar i { left: 0; width: 100%; opacity: .35; }
}

<script>
(function () {
  var D = { state: { plans: [] }, activity: [], now: '' };
  var ui = load('wb-ui', { view: 'home', layout: 'board', tab: 'summary', q: '' });
  if (ui.view === 'activity') ui.view = 'home';
  if (!['board','list','timeline','summary'].includes(ui.layout)) ui.layout = 'board';
  // Clear saved search filters on opening; List starts with tasks in progress.
  // Filters from retired features (agent, result, updated date) are dropped from saved preferences.
  delete ui.agent;delete ui.taskResult;delete ui.taskDates;
  ui.q='';ui.activityDay='';
  ui.taskStatus='doing';ui.focusTask=null;
  ui.taskPlans=null;ui.taskWork='';
  if(!['none','plan'].includes(ui.taskGroup))ui.taskGroup='none';
  if(!ui.collapsedPlans || typeof ui.collapsedPlans!=='object' || Array.isArray(ui.collapsedPlans))ui.collapsedPlans={};
  if(!ui.planDetails || typeof ui.planDetails!=='object' || Array.isArray(ui.planDetails))ui.planDetails={};
  if(ui.view==='waiting') ui.view='home';
  var navigation=load('wb-navigation',{starred:[],recent:[],section:'all',collapsed:!!(window.matchMedia && window.matchMedia('(max-width:760px)').matches)});
  navigation.starred=Array.isArray(navigation.starred)?Array.from(new Set(navigation.starred.filter(function(k){return typeof k==='string';}))).slice(0,200):[];
  navigation.recent=Array.isArray(navigation.recent)?navigation.recent.filter(function(r){return r && typeof r.key==='string' && Number.isFinite(new Date(r.openedAt).getTime());}).filter(function(r,i,a){return a.findIndex(function(x){return x.key===r.key;})===i;}).slice(0,12):[];
  if(!['all','starred','recent'].includes(navigation.section))navigation.section='all';
  navigation.collapsed=!!navigation.collapsed;
  var quick={key:null,tab:'overview',returnTo:null,sequence:[]};
  function load(k, d) { try { return Object.assign(d, JSON.parse(localStorage.getItem(k) || '{}')); } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* Preferences are optional when browser storage is unavailable. */ } }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function $(id) { return document.getElementById(id); }

  function stage(s) { var i = (s || '').indexOf(' - '); return i > 0 ? s.slice(0, i) : (s || ''); }
  function detail(s) { var i = (s || '').indexOf(' - '); return i > 0 ? s.slice(i + 3) : ''; }
  function statusTone(value){
    var current=stage(value).toLowerCase();
    if(current==='done')return 'done';if(current==='blocked')return 'blocked';

  }

  function prs(text, gh) { var h = esc(text); return gh ? h.replace(/#(\d+)\b/g, function (m, n) { return '<a class="pr" target="_blank" href="' + esc(gh) + '/pull/' + n + '">#' + n + '</a>'; }) : h; }
  // Plan identity includes the project, so same-named repositories in two projects stay apart.
  function key(p) { return (p.project ? p.project + '/' : '') + p.repo + '/' + p.name; }
  function eventKey(e) { return (e.project ? e.project + '/' : '') + e.repo + '/' + e.plan; }
  function repoLabel(p) { return D.state.plans.some(function(o){return o.repo===p.repo && o.project!==p.project;}) && p.projectName ? p.repo+' · '+p.projectName : p.repo; }

  }

  function connection(online) { $('live').className = online ? 'live' : 'live off'; $('connection').textContent = online ? 'Live' : 'Reconnecting…'; }
  function get() { return fetch('/api/state', { cache: 'no-store' }).then(function (r) { if(!r.ok) throw Error('State request failed: '+r.status); return r.json(); }).then(function (j) {
    if (!j.state || !Array.isArray(j.state.plans) || !Array.isArray(j.activity)) throw Error(j.error || 'Invalid state response');
    if(D.appVersion && j.appVersion && D.appVersion!==j.appVersion){save('wb-update-view',{version:j.appVersion,ui:ui,scroll:$('view').scrollTop,horizontal:$('view').scrollLeft,quick:{key:quick.key,tab:quick.tab,sequence:quick.sequence,scroll:$('quick-plan-scroll') && $('quick-plan-scroll').scrollTop}});location.reload();return j;}
    var restored=restoreUpdateView(j);
    D = j; if(!storedKeysMigrated && D.state.plans.length){storedKeysMigrated=true;migrateStoredPlanKeys();}
    showError(D.error); render(); showWarnings(D.warnings); showCrash(D.crash); syncSetup(); renderUpdate();
    if(restored){$('view').scrollTop=restored.scroll || 0;$('view').scrollLeft=restored.horizontal || 0;if(restored.quick && restored.quick.key && planByKey(restored.quick.key)){openQuickPlan(restored.quick.key,restored.quick.sequence);quick.tab=restored.quick.tab;renderQuickPlan(true);if($('quick-plan-scroll'))$('quick-plan-scroll').scrollTop=restored.quick.scroll || 0;}}
    return j;
  }).catch(function (e) { if(!updateInstalling())showError(e.message);return null; }); }
  function connect() {
    var es = new EventSource('/events');
    es.onopen = function () { connection(true); get(); };
    es.onmessage = function () { get(); };
    es.onerror = function () { connection(false); };
  }
  function jumpHash() {
    if (location.hash === '#settings') {
      if (typeof history !== 'undefined' && history.replaceState) history.replaceState(null, '', location.pathname + location.search);
      openSettings('general');
      return;
    }
    if (location.hash.indexOf('#plan=') === 0) {
      try { ui.view = 'plan:' + decodeURIComponent(location.hash.slice(6).replace(/\+/g, ' ')); ui.tab = 'summary'; ui.q = ''; save('wb-ui',ui); } catch(e) { /* An invalid external fragment leaves the current view intact. */ }
    }
  }
  window.addEventListener('hashchange',function(){jumpHash();render();});
  if($('quick-plan'))$('quick-plan').addEventListener('cancel',function(e){e.preventDefault();closeQuickPlan();});
  document.addEventListener('keydown',function(e){
    if(settingsKey(e))return;
    if(e.key==='F5'){e.preventDefault();if(!e.repeat)refresh();return;}
    if(quick.key){
      if(e.key==='Escape'){e.preventDefault();closeQuickPlan();return;}
      if(e.ctrlKey && e.key.toLowerCase()==='k'){e.preventDefault();if($('quick-plan-scroll'))$('quick-plan-scroll').focus();return;}
      if(e.altKey && ['ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();stepQuickPlan(e.key==='ArrowDown'?1:-1);return;}
      var tab=e.target.closest && e.target.closest('[data-quick-tab]');
      if(tab && ['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){
        e.preventDefault();var tabs=['overview','checklist','activity'],i=tabs.indexOf(quick.tab);
        quick.tab=tabs[e.key==='Home'?0:e.key==='End'?2:(i+(e.key==='ArrowRight'?1:-1)+3)%3];renderQuickPlan(true);if($('quick-tab-'+quick.tab))$('quick-tab-'+quick.tab).focus();return;
      }
    }
    if(e.key==='Escape' && columnMenu){e.preventDefault();dismissColumnMenu(true);return;}
    if(e.key==='Enter' && columnMenu && e.target.tagName==='INPUT' && e.target.type!=='checkbox'){e.preventDefault();applyColumnMenu();return;}
    var typing = typingIn(e.target);
    if (e.ctrlKey && e.key.toLowerCase()==='k') {e.preventDefault(); if($('q')) {$('q').focus();$('q').select();} return;}
    if (e.ctrlKey && !e.altKey && e.key===',') {e.preventDefault(); openSettings('general'); return;}
    if (e.key==='Escape' && ui.view.indexOf('plan:')===0) {ui.view='home';ui.q='';ui.activityDay='';save('wb-ui',ui);render();return;}
    if (typing) return;
    if (e.altKey && (e.key==='ArrowUp' || e.key==='ArrowDown')) {
      e.preventDefault(); var ps=plans(), i=ps.findIndex(function(p){return ui.view==='plan:'+key(p);});
      if(ps.length) {i=(i+(e.key==='ArrowDown'?1:-1)+ps.length)%ps.length;ui.view='plan:'+key(ps[i]);ui.q='';ui.tab='summary';save('wb-ui',ui);render();$('view').scrollTop=0;}
    } else if (!e.ctrlKey && !e.altKey && !e.metaKey && shortcutsOn()) {
      // Single-key shortcuts; Settings > General turns them off.
      if (e.key.toLowerCase()==='r') { e.preventDefault();refresh(); }
      else if (e.key==='/') { e.preventDefault(); if($('q')) {$('q').focus();$('q').select();} }
      else if (e.key===',') { e.preventDefault(); openSettings('general'); }
    }
  });
  jumpHash(); get(); connect(); initUpdates(); loadSettings();
  setInterval(get, 30000); // server owns the same stale rule used by toasts
})();
</script>
</body>
