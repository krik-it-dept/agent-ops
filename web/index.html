<style>
/* Product UI tokens from the owner's Jira reference, section 2.3 and sections 3?5. */
:root {
  color-scheme: light dark;
  --ds-font-family-body: "Atlassian Sans", "Segoe UI", system-ui, sans-serif;
  --ds-font-family-code: "Atlassian Mono", "Cascadia Code", "Segoe UI Mono", monospace;
  --ds-font-weight-heading: 653;
  --ds-surface: #FFFFFF;
  --ds-surface-sunken: #F8F8F8;
  --ds-surface-container: #F0F1F2;
  --ds-surface-raised: #FFFFFF;
  --ds-surface-raised-hovered: #F0F1F2;
  --ds-text: #292A2E;
  --ds-text-subtle: #505258;
  --ds-text-subtlest: #6B6E76;
  --ds-text-inverse: #FFFFFF;
  --ds-text-disabled: #080F214A;
  --ds-link: #1868DB;
  --ds-background-brand-bold: #1868DB;
  --ds-background-brand-bold-hovered: #1558BC;
  --ds-background-brand-bold-pressed: #144794;
  --ds-background-brand-subtlest: #E9F2FE;
  --ds-background-neutral: #0515240F;
  --ds-background-neutral-hovered: #0B120E24;
  --ds-background-neutral-pressed: #DDDEE1;
  --ds-background-input: #FFFFFF;
  --ds-background-input-hovered: #F8F8F8;
  --ds-text-information: #1558BC;
  --ds-background-information: #E9F2FE;
  --ds-text-success: #216E4E;
  --ds-background-success: #DCFFF1;
  --ds-text-warning: #9E4C00;
  --ds-background-warning: #FFF5DB;
  --ds-text-danger: #AE2E24;
  --ds-background-danger: #FFECEB;
  --ds-text-discovery: #803FA5;
  --ds-background-discovery: #F8EEFE;
  --ds-border: #0B120E24;
  --ds-border-input: #8C8F97;
  --ds-border-focused: #4688EC;
  --ds-shadow-raised: 0 1px 1px rgba(30,31,33,.25), 0 0 1px rgba(30,31,33,.31);
  --ds-space-025: 2px;
  --ds-space-050: 4px;
  --ds-space-075: 6px;
  --ds-space-100: 8px;
  --ds-space-150: 12px;
  --ds-space-200: 16px;
  --ds-space-250: 20px;
  --ds-space-300: 24px;
  --ds-space-400: 32px;
  --ds-radius-small: 3px;
  --ds-radius-medium: 6px;
  --ds-radius-large: 8px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ds-surface: #1D2125;
    --ds-surface-sunken: #161A1D;
    --ds-surface-container: #2C333A;
    --ds-surface-raised: #22272B;
    --ds-surface-raised-hovered: #2C333A;
    --ds-text: #DEE4EA;
    --ds-text-subtle: #B6C2CF;
    --ds-text-subtlest: #9FADBC;
    --ds-text-disabled: #BFDBF847;
    --ds-link: #85B8FF;
    --ds-background-brand-subtlest: #092957;
    --ds-background-neutral: #A1BDD914;
    --ds-background-neutral-hovered: #A6C5E229;
    --ds-background-neutral-pressed: #38414A;
    --ds-background-input: #22272B;
    --ds-background-input-hovered: #282E33;
    --ds-text-information: #85B8FF;
    --ds-background-information: #092957;
    --ds-text-success: #7EE2B8;
    --ds-background-success: #164B35;
    --ds-text-warning: #F5CD47;
    --ds-background-warning: #533F04;
    --ds-text-danger: #FD9891;
    --ds-background-danger: #5D1F1A;
    --ds-text-discovery: #D8A0F7;
    --ds-background-discovery: #48245D;
    --ds-border: #A6C5E229;
    --ds-border-input: #738496;
    --ds-border-focused: #85B8FF;
    --ds-shadow-raised: 0 1px 1px #03040480, 0 0 1px #03040480;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--ds-surface); color: var(--ds-text); font: 400 14px/20px var(--ds-font-family-body); }
button, input, select { font: inherit; color: inherit; }
button, select { cursor: pointer; }
button:disabled, select:disabled { cursor: default; color: var(--ds-text-disabled); }
a { color: var(--ds-link); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--ds-border-focused); outline-offset: 2px;
}
.mono, time, .id { font-family: var(--ds-font-family-code); font-variant-numeric: tabular-nums; }
.app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
.appbar {
  display: flex; align-items: center; gap: var(--ds-space-300); height: 48px; flex-shrink: 0;
  padding: 0 var(--ds-space-200); border-bottom: 1px solid var(--ds-border);
}
.nav { display: flex; align-self: stretch; gap: var(--ds-space-200); }
.item { position: relative; display: flex; align-items: center; gap: var(--ds-space-100); border: 0; background: transparent; padding: 0 var(--ds-space-050); color: var(--ds-text-subtle); font-weight: 500; white-space: nowrap; }
.item:hover { color: var(--ds-link); }
.item.on { color: var(--ds-link); }
.item.on::after { position: absolute; bottom: -1px; left: 0; right: 0; height: 3px; background: var(--ds-link); border-radius: 2px 2px 0 0; content: ""; }
.badge { padding: 0 var(--ds-space-050); border-radius: var(--ds-radius-small); background: var(--ds-background-neutral); font-size: 12px; line-height: 16px; font-variant-numeric: tabular-nums; }
.save-state { margin-left: auto; font-size: 12px; color: var(--ds-text-subtle); }
.connection { font-size: 12px; color: var(--ds-text-subtlest); white-space: nowrap; }
.live { width: 6px; height: 6px; border-radius: 50%; background: var(--ds-text-success); flex-shrink: 0; }
.live.off { background: var(--ds-text-warning); }
#upd { font-size: 12px; color: var(--ds-text-subtlest); }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; flex: 1; }
.top { display: flex; align-items: center; flex-wrap: wrap; gap: var(--ds-space-150); padding: var(--ds-space-300); background: var(--ds-surface); flex-shrink: 0; }
.top h1 { margin: 0; font-size: 24px; line-height: 28px; font-weight: var(--ds-font-weight-heading); overflow-wrap: anywhere; }
.sub { color: var(--ds-text-subtlest); font-size: 12px; }
.search { margin-left: auto; width: min(300px, 32vw); min-height: 32px; border: 1px solid var(--ds-border-input); border-radius: var(--ds-radius-small); padding: 5px var(--ds-space-100); background: var(--ds-background-input); }
.search::placeholder { color: var(--ds-text-subtlest); }
.search:hover { background: var(--ds-background-input-hovered); }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 32px; padding: 5px var(--ds-space-150); border: 1px solid transparent; border-radius: var(--ds-radius-small); background: var(--ds-background-neutral); font-size: 14px; font-weight: 500; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--ds-background-neutral-hovered); }
.btn:active { background: var(--ds-background-neutral-pressed); }
.view { overflow: auto; overscroll-behavior: contain; flex: 1; min-height: 0; padding: 0 var(--ds-space-300) var(--ds-space-300); background: var(--ds-surface); scrollbar-color: var(--ds-border-input) transparent; }
.view.detail { padding-top: var(--ds-space-300); }
.error { padding: var(--ds-space-100) var(--ds-space-300); background: var(--ds-background-danger); color: var(--ds-text-danger); font-size: 12px; overflow-wrap: anywhere; }
.board { display: grid; grid-template-columns: repeat(5, 280px); gap: var(--ds-space-150); width: max-content; min-width: 100%; min-height: 100%; align-items: stretch; }
.column { min-width: 0; min-height: 240px; padding: var(--ds-space-100); border-radius: var(--ds-radius-medium); background: var(--ds-surface-sunken); }
.column h2 { display: flex; align-items: center; gap: var(--ds-space-100); position: sticky; top: 0; z-index: 1; min-height: 36px; margin: 0 0 var(--ds-space-100); padding: var(--ds-space-100) var(--ds-space-050); background: var(--ds-surface-sunken); color: var(--ds-text-subtle); font-size: 14px; line-height: 20px; font-weight: var(--ds-font-weight-heading); text-transform: uppercase; }
.column h2 span { padding: 0 var(--ds-space-050); border-radius: var(--ds-radius-small); background: var(--ds-background-neutral); font-family: var(--ds-font-family-code); font-size: 12px; line-height: 16px; font-weight: 400; }
.task-card { position: relative; border: 1px solid transparent; border-radius: var(--ds-radius-large); background: var(--ds-surface-raised); box-shadow: var(--ds-shadow-raised); padding: var(--ds-space-150); margin-bottom: var(--ds-space-100); cursor: pointer; }
.task-card:hover { background: var(--ds-surface-raised-hovered); }
.task-card:focus-within { outline: 2px solid var(--ds-border-focused); outline-offset: 2px; }
.task-heading { display: flex; align-items: baseline; justify-content: space-between; gap: var(--ds-space-100); margin-bottom: var(--ds-space-100); }
.task-repo { min-width: 0; color: var(--ds-text-subtle); font-size: 12px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task-edited { font-size: 12px; line-height: 16px; color: var(--ds-text-subtlest); white-space: nowrap; flex-shrink: 0; }
.task-title { display: block; width: 100%; border: 0; background: none; text-align: left; padding: 0; font-size: 14px; line-height: 20px; font-weight: 500; overflow-wrap: anywhere; }
.task-next { color: var(--ds-text-subtle); margin: var(--ds-space-100) 0; font-size: 12px; line-height: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.task-status { display: flex; align-items: center; gap: var(--ds-space-050); flex-wrap: wrap; margin-top: var(--ds-space-100); }
.stage-detail { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 12px; line-height: 16px; color: var(--ds-text-subtle); margin-top: var(--ds-space-050); overflow-wrap: anywhere; }
.task-progress { display: flex; align-items: center; gap: var(--ds-space-100); margin-top: var(--ds-space-150); font-size: 12px; color: var(--ds-text-subtlest); }
.task-progress .bar { flex: 1; min-width: 32px; }
.task-footer { display: flex; align-items: center; justify-content: flex-end; margin-top: var(--ds-space-150); font-size: 12px; color: var(--ds-text-subtle); }
.assignee { display: flex; align-items: center; gap: var(--ds-space-100); min-width: 0; }
.assignee .owner { max-width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.av { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; color: #FFFFFF; font-size: 12px; line-height: 16px; font-weight: 500; flex-shrink: 0; }
.empty-column { padding: var(--ds-space-150) var(--ds-space-050); color: var(--ds-text-subtlest); font-size: 12px; }
.empty { color: var(--ds-text-subtlest); padding: var(--ds-space-400) var(--ds-space-200); text-align: center; }
.pill { display: inline-flex; align-items: center; max-width: 100%; padding: 2px var(--ds-space-075); border-radius: var(--ds-radius-small); font-size: 12px; line-height: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; overflow-wrap: anywhere; }
.t-doing, .t-test { background: var(--ds-background-information); color: var(--ds-text-information); }
.t-ok { background: var(--ds-background-success); color: var(--ds-text-success); }
.t-review { background: var(--ds-background-discovery); color: var(--ds-text-discovery); }
.t-pending { background: var(--ds-background-warning); color: var(--ds-text-warning); }
.t-bad { background: var(--ds-background-danger); color: var(--ds-text-danger); }
.t-idle { background: var(--ds-background-neutral-pressed); color: var(--ds-text); }
.bar { height: 4px; background: var(--ds-background-neutral-pressed); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ds-link); }
.pipe { display: inline-flex; gap: 3px; }
.pipe i { width: 12px; height: 3px; border-radius: 1px; background: var(--ds-background-neutral-pressed); }
.pipe i.p { background: var(--ds-link); opacity: .4; }
.pipe i.c { background: var(--ds-link); }
.pr { font-weight: 500; text-decoration: none; }
.pr:hover { text-decoration: underline; }
.chead { display: grid; gap: var(--ds-space-150); max-width: 1200px; width: 100%; margin: auto; }
.chead .t { display: flex; align-items: center; gap: var(--ds-space-150); flex-wrap: wrap; }
.chead .t h1 { font-size: 24px; line-height: 28px; max-width: 560px; }
.chead .goal { font-size: 14px; line-height: 20px; max-width: 900px; }
.chead .meta { display: flex; align-items: center; gap: var(--ds-space-150); flex-wrap: wrap; font-size: 12px; color: var(--ds-text-subtle); }
.chead .stage-detail { max-width: 540px; }
.tabs { display: flex; gap: var(--ds-space-200); padding: 0 var(--ds-space-300); border-bottom: 1px solid var(--ds-border); background: var(--ds-surface); }
.tab { position: relative; border: 0; background: none; min-height: 40px; padding: var(--ds-space-100) var(--ds-space-050); font-size: 14px; font-weight: 500; color: var(--ds-text-subtle); border-bottom: 3px solid transparent; }
.tab.on { color: var(--ds-link); border-bottom-color: var(--ds-link); }
.tab span { margin-left: var(--ds-space-050); font-size: 12px; font-weight: 400; color: var(--ds-text-subtlest); }
.tabs .tab:first-child { padding-left: 0; }
.detail > * { max-width: none; margin-left: 0; margin-right: 0; }
.pin { padding: var(--ds-space-150); margin-bottom: var(--ds-space-300); background: var(--ds-surface-sunken); border-radius: var(--ds-radius-medium); font-size: 14px; }
.pin b { margin-right: var(--ds-space-150); color: var(--ds-text-subtle); font-size: 12px; text-transform: uppercase; }
.ms { margin-bottom: var(--ds-space-300); border-bottom: 1px solid var(--ds-border); padding-bottom: var(--ds-space-200); }
.ms-h { display: flex; align-items: center; gap: var(--ds-space-100); flex-wrap: wrap; font-size: 14px; }
.ms-h b { font-weight: var(--ds-font-weight-heading); }
.ms-h .id { color: var(--ds-text-subtle); font-size: 12px; }
.ms-h .c { margin-left: auto; color: var(--ds-text-subtlest); font-size: 12px; }
.ms-h .bar { width: 100px; }
.sum { margin: var(--ds-space-100) 0; padding: var(--ds-space-100) var(--ds-space-150); background: var(--ds-surface-sunken); font-size: 14px; border-radius: var(--ds-radius-small); }
.st { display: grid; grid-template-columns: 16px 1fr auto; gap: var(--ds-space-100); padding: var(--ds-space-100) 0; border-top: 1px solid var(--ds-border); font-size: 14px; }
.st:first-of-type { border-top: 0; }
.box { display: grid; place-items: center; width: 16px; height: 16px; border: 1px solid var(--ds-border-input); border-radius: var(--ds-radius-small); font-size: 12px; margin-top: 2px; }
.s-done .box { background: var(--ds-background-success); border-color: var(--ds-text-success); color: var(--ds-text-success); }
.s-done .tx { color: var(--ds-text-subtle); }
.s-doing .box { border-color: var(--ds-link); color: var(--ds-link); }
.s-blocked .box, .s-blocked .tx { color: var(--ds-text-danger); }
.tag { height: fit-content; padding: 0 var(--ds-space-050); border-radius: var(--ds-radius-small); background: var(--ds-surface-container); color: var(--ds-text-subtle); font-size: 12px; white-space: nowrap; }
.list .li { display: grid; grid-template-columns: 120px 1fr; gap: var(--ds-space-200); padding: var(--ds-space-150) 0; border-bottom: 1px solid var(--ds-border); font-size: 14px; }
.li time, .li .a { color: var(--ds-text-subtle); }
.li .a::before { content: "? "; }
.feed { display: flex; flex-direction: column; }
.day { margin: var(--ds-space-200) 0 var(--ds-space-100); padding-bottom: var(--ds-space-050); border-bottom: 1px solid var(--ds-border); font-size: 12px; color: var(--ds-text-subtlest); }
.msg { display: grid; grid-template-columns: 24px 1fr; gap: var(--ds-space-150); padding: var(--ds-space-100) 0; }
.mh { display: flex; align-items: baseline; gap: var(--ds-space-100); flex-wrap: wrap; font-size: 14px; }
.mh time { font-size: 12px; color: var(--ds-text-subtlest); }
.mb { font-size: 14px; margin-top: var(--ds-space-050); overflow-wrap: anywhere; }
.mb .x { color: var(--ds-text-subtle); }
.blk { border-left: 2px solid var(--ds-border); padding: var(--ds-space-050) var(--ds-space-150); }
.blk .k { margin-bottom: var(--ds-space-050); font-size: 12px; font-weight: var(--ds-font-weight-heading); color: var(--ds-text-subtle); }
.k-blocked, .k-stale { border-color: var(--ds-text-danger); }
.k-decision { border-color: var(--ds-text-discovery); }
.k-waiting { border-color: var(--ds-text-warning); }
.ok { color: var(--ds-text-success); }
.column.drop-target, .column.drop-target h2 { background: var(--ds-background-brand-subtlest); }
.column.drop-target { outline: 2px dashed var(--ds-border-focused); outline-offset: -2px; }
.task-card[draggable="true"] { cursor: grab; }
.task-card.dragging { opacity: .45; }
.status-select { min-height: 32px; max-width: 220px; border: 1px solid transparent; border-radius: var(--ds-radius-small); background: var(--ds-background-neutral); padding: var(--ds-space-050) var(--ds-space-100); font-size: 14px; font-weight: 500; }
.status-select:hover { background: var(--ds-background-neutral-hovered); }
@media (max-width: 760px) {
  .appbar { height: auto; min-height: 48px; flex-wrap: wrap; gap: var(--ds-space-150); padding: 0 var(--ds-space-150); }
  .nav { min-height: 48px; gap: var(--ds-space-100); }
  .save-state { font-size: 12px; }
  .connection { margin-left: auto; }
  .save-state:empty { display: none; }
  #upd { display: none; }
  .top { padding: var(--ds-space-200) var(--ds-space-150); gap: var(--ds-space-100); }
  .top h1, .chead .t h1 { font-size: 20px; line-height: 24px; }
  .search { width: min(280px, 100%); flex: 1 1 180px; }
  .chead .search { margin-left: 0; }
  .view { padding-left: var(--ds-space-150); padding-right: var(--ds-space-150); }
  .tabs { padding: 0 var(--ds-space-150); gap: var(--ds-space-100); overflow-x: auto; }
  .tab { flex-shrink: 0; }
  .list .li { grid-template-columns: 1fr; gap: var(--ds-space-050); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }

/* Workspace views and agent identity. */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.agent-chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px;line-height:20px;color:var(--ds-text-subtle)}
.agent-icon{width:20px;height:20px;object-fit:contain;flex-shrink:0}.agent-icon-codex{padding:3px;border-radius:4px;background:#181818}.agent-icon-anti{border-radius:4px;background:#fff}
.agent-unknown{display:grid;place-items:center;width:20px;height:20px;border:1px solid var(--ds-border-input);border-radius:50%;color:var(--ds-text-subtlest);font-weight:500}
.agent-editor{display:inline-flex;align-items:center;gap:6px}.agent-editor .agent-chip>span:last-child{display:none}.agent-select,.agent-filter{height:32px;border:1px solid var(--ds-border);border-radius:3px;background:var(--ds-surface);padding:4px 8px;font-size:14px;max-width:150px}.agent-select:hover,.agent-filter:hover{background:var(--ds-background-neutral)}

<body>
<div class="app">
  <header class="appbar">
    <button class="icon-btn sidebar-toggle" id="sidebar-toggle" data-sidebar-toggle aria-label="Toggle plans sidebar" aria-controls="plan-sidebar" aria-expanded="true" title="Plans"></button>
    <nav class="nav" id="nav" aria-label="Views"></nav>
    <span class="save-state" id="save-state" role="status" aria-live="polite"></span>
    <button class="btn update-launcher" id="update-launcher" data-update-open title="Software updates">Updates</button>
    <span class="connection" id="connection" role="status">Connecting…</span>
    <span class="live" id="live" title="Connection"></span><small id="upd"></small>
  </header>
  <div class="workspace">
  <aside class="plan-sidebar" id="plan-sidebar" aria-label="Plans navigation"></aside>
  <main class="main">
    <div class="error" id="error" role="status" hidden></div>
    <div class="top" id="top"></div>
    <div id="tabs"></div>
    <div class="view" id="view"></div>
  </main>
  </div>
</div>
<dialog class="quick-plan" id="quick-plan" aria-labelledby="quick-plan-title"><div class="quick-shell" id="quick-plan-content"></div></dialog>
<dialog class="update-dialog" id="update-dialog" aria-labelledby="update-title"><div id="update-content"></div></dialog>
<script>
(function () {
  var D = { state: { plans: [], slots: {} }, activity: [], now: '' };
  var ui = load('wb-ui', { view: 'home', layout: 'board', tab: 'summary', q: '', agent: 'all' });
  if (ui.view === 'activity') ui.view = 'home';
  if (!['board','list','timeline','summary'].includes(ui.layout)) ui.layout = 'board';
  // Clear saved search/agent filters on opening; List starts with tasks in progress.
  ui.agent='all';ui.q='';ui.activityDay='';
  ui.taskStatus='doing';ui.focusTask=null;
  ui.taskPlans=null;ui.taskWork='';ui.taskResult='';ui.taskDates={mode:'all',from:'',to:''};
  if(!['none','plan'].includes(ui.taskGroup))ui.taskGroup='none';
  if(!ui.collapsedPlans || typeof ui.collapsedPlans!=='object' || Array.isArray(ui.collapsedPlans))ui.collapsedPlans={};
  if(!ui.planDetails || typeof ui.planDetails!=='object' || Array.isArray(ui.planDetails))ui.planDetails={};
  if(ui.view==='waiting') ui.view='home';
  var navigation=load('wb-navigation',{starred:[],recent:[],section:'all',collapsed:!!(window.matchMedia && window.matchMedia('(max-width:760px)').matches)});
  navigation.starred=Array.isArray(navigation.starred)?Array.from(new Set(navigation.starred.filter(function(k){return typeof k==='string';}))).slice(0,200):[];
  navigation.recent=Array.isArray(navigation.recent)?navigation.recent.filter(function(r){return r && typeof r.key==='string' && Number.isFinite(new Date(r.openedAt).getTime());}).filter(function(r,i,a){return a.findIndex(function(x){return x.key===r.key;})===i;}).slice(0,12):[];
  if(!['all','starred','recent'].includes(navigation.section))navigation.section='all';
  navigation.collapsed=!!navigation.collapsed;
  var quick={key:null,tab:'overview',returnTo:null,sequence:[]};
  function load(k, d) { try { return Object.assign(d, JSON.parse(localStorage.getItem(k) || '{}')); } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* Preferences are optional when browser storage is unavailable. */ } }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function $(id) { return document.getElementById(id); }

  function stage(s) { var i = (s || '').indexOf(' - '); return i > 0 ? s.slice(0, i) : (s || ''); }
  function detail(s) { var i = (s || '').indexOf(' - '); return i > 0 ? s.slice(i + 3) : ''; }
  function statusTone(value){
    var current=stage(value).toLowerCase();
    if(current==='done')return 'done';if(current==='blocked')return 'blocked';
    if(/^waiting/.test(current))return 'waiting';if(/^(reviewing|fixing review|testing)$/.test(current))return 'review';
    if(/^(implementing|shipping|in progress|partly done|dry run)$/.test(current))return 'doing';return 'todo';
  }
  function pill(p) { return '<span class="pill status-'+statusTone(p.status)+'">'+esc(stage(p.status) || 'Not started')+'</span>'; }
  function prs(text, gh) { var h = esc(text); return gh ? h.replace(/#(\d+)\b/g, function (m, n) { return '<a class="pr" target="_blank" href="' + esc(gh) + '/pull/' + n + '">#' + n + '</a>'; }) : h; }
  function key(p) { return p.repo + '/' + p.name; }
  function counts(p) { var c = { todo: 0, doing: 0, done: 0, partial: 0, blocked: 0 }; p.steps.forEach(function (s) { c[s.status]++; }); return c; }
  function pct(p) { var c = counts(p); return p.steps.length ? Math.round(c.done * 100 / p.steps.length) : 0; }
  function ago(t) { var m = Math.round((Date.now() - new Date(t)) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago'; }
  function hhmm(t) {return new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Ho_Chi_Minh',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(t));}
  function dayLabel(t) {
    var d=new Date(t),today=dateKey(D.now || new Date()),yesterday=new Date(today+'T12:00:00+07:00');yesterday.setUTCDate(yesterday.getUTCDate()-1);
    if(dateKey(d)===today)return 'Today';if(dateKey(d)===dateKey(yesterday))return 'Yesterday';
    return d.toLocaleDateString('en-GB',{weekday:'long',day:'2-digit',month:'2-digit',timeZone:'Asia/Ho_Chi_Minh'});
  }
  function color(name) { var palette = ['#1558BC','#4C6B1F','#803FA5','#206A83','#943D73','#AE4B04'], h = 0; for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % palette.length; return palette[h]; }
  function initials(name) { var w = (name || '?').replace(/[^\p{L}\p{N} ]/gu, ' ').trim().split(/\s+/); return ((w[0] || '?')[0] + ((w[1] || '')[0] || '')).toUpperCase(); }
  function isWaiting(p) { return /^waiting for owner/i.test(p.status || ''); }
  var ACTIVE = /^(planning|implementing|reviewing|fixing review|testing)$/i;
  function isStale(p) { return D.stale ? !!D.stale[key(p)] : ACTIVE.test(stage(p.status)) && (Date.now() - new Date(p.mtime)) >= 120 * 60000; }
  function plans() { return D.state.plans.slice().sort(function (a, b) { return new Date(b.mtime) - new Date(a.mtime); }); }
  function planByKey(k) { return D.state.plans.find(function (p) { return key(p) === k; }); }
  function icon(name){
    var paths={star:'m12 3 2.8 5.7 6.3.9-4.6 4.5 1.1 6.3-5.6-3-5.6 3 1.1-6.3L3 9.6l6.2-.9Z',sidebar:'M9 4v16M4 4h16v16H4Z',close:'m6 6 12 12M18 6 6 18',preview:'M14 4h6v6M20 4l-9 9M10 4H4v16h16v-6'};
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+paths[name]+'"/></svg>';
  }
  function starButton(p,id){var on=navigation.starred.includes(key(p)),label=(on?'Unstar ':'Star ')+p.name;return '<button'+(id?' id="'+id+'"':'')+' class="icon-btn star-toggle" data-star-plan="'+esc(key(p))+'" aria-pressed="'+on+'" aria-label="'+esc(label)+'" title="'+esc(label)+'">'+icon('star')+'</button>';}
  function recordPlanVisit(k){
    if(!planByKey(k))return;
    navigation.recent=[{key:k,openedAt:new Date().toISOString()}].concat(navigation.recent.filter(function(r){return r.key!==k;})).slice(0,12);
    save('wb-navigation',navigation);
  }
  function sidebarPlans(){
    if(navigation.section==='recent')return navigation.recent.map(function(r){return planByKey(r.key);}).filter(Boolean);
    var list=plans();if(navigation.section==='starred')list=list.filter(function(p){return navigation.starred.includes(key(p));});
    return list;
  }
  function renderSidebar(){
    var side=$('plan-sidebar'),toggle=$('sidebar-toggle');if(!side)return;
    var active=document.activeElement,activeId=active && active.id && active.id.startsWith('sidebar-')?active.id:null;
    side.hidden=navigation.collapsed;
    if(toggle){toggle.innerHTML=icon('sidebar');toggle.setAttribute('aria-expanded',String(!navigation.collapsed));toggle.title=navigation.collapsed?'Show plans':'Hide plans';}
    var current=quick.key || (ui.view.startsWith('plan:')?ui.view.slice(5):''),list=sidebarPlans(),counts={all:plans().length,starred:plans().filter(function(p){return navigation.starred.includes(key(p));}).length,recent:navigation.recent.filter(function(r){return !!planByKey(r.key);}).length};
    var html='<div class="sidebar-head">Plans<small class="work-meta">'+counts.all+'</small></div><div class="sidebar-collections" role="group" aria-label="Plan collections">'+[['all','All'],['starred','Starred'],['recent','Recent']].map(function(a){return '<button id="sidebar-collection-'+a[0]+'" data-plan-collection="'+a[0]+'" aria-pressed="'+(navigation.section===a[0])+'">'+a[1]+' '+counts[a[0]]+'</button>';}).join('')+'</div><nav class="sidebar-items" aria-label="'+(navigation.section==='all'?'All plans':navigation.section==='starred'?'Starred plans':'Recently viewed plans')+'">'+list.map(function(p){var recent=navigation.recent.find(function(r){return r.key===key(p);});return '<div class="sidebar-plan'+(key(p)===current?' current':'')+(stage(p.status)==='Done'?' is-done':'')+'"><button id="sidebar-plan-'+encodeURIComponent(key(p))+'" class="sidebar-plan-link" data-preview-plan="'+esc(key(p))+'" title="Quick view: '+esc(p.name)+'"'+(key(p)===current?' aria-current="page"':'')+'><span><i class="plan-state-dot status-'+statusTone(p.status)+'" aria-hidden="true"></i>'+esc(p.name)+'</span><small>'+esc(p.repo)+(navigation.section==='recent' && recent?' · viewed '+ago(recent.openedAt):'')+'</small></button>'+starButton(p,'sidebar-star-'+encodeURIComponent(key(p)))+'</div>';}).join('')+(list.length?'':'<div class="sidebar-empty">'+(navigation.section==='starred'?'Star plans to keep them here.':navigation.section==='recent'?'Plans appear here after you open them.':'No plans yet.')+'</div>')+'</nav>';
    if(side.innerHTML!==html){var old=side.querySelector && side.querySelector('.sidebar-items'),scroll=old?old.scrollTop:0;side.innerHTML=html;var next=side.querySelector && side.querySelector('.sidebar-items');if(next)next.scrollTop=scroll;}
    if(activeId){var nextFocus=$(activeId) || $('sidebar-collection-'+navigation.section);if(nextFocus)nextFocus.focus({preventScroll:true});}
  }
  function openQuickPlan(k,keepSequence){
    if(!planByKey(k))return;
    var dialog=$('quick-plan');if(!dialog)return;
    if(!quick.key)quick.returnTo=document.activeElement;
    if(!keepSequence){var list=sidebarPlans();if(!list.some(function(p){return key(p)===k;}))list=plans();quick.sequence=list.map(key);}

    quick.key=k;if(!keepSequence)quick.tab='overview';recordPlanVisit(k);renderQuickPlan(true);renderSidebar();

  function closeQuickPlan(restore){

  }
  function quickRowsTable(p,rows){
    if(!rows.length)return '';
    var groups=groupedPlanRows(p,rows);
    return '<table class="quick-table"><thead><tr><th scope="col">Work</th><th scope="col">Agent</th><th scope="col">Status</th></tr></thead><tbody>'+groups.map(function(g){return (g.milestone?'<tr class="quick-group-row"><td colspan="3">'+esc(g.milestone.title)+'</td></tr>':'')+g.rows.map(function(r){var s=r.s;return '<tr><td><button class="work-link" data-open-task="'+esc(key(p))+'" data-task-index="'+r.index+'" data-task-revision="'+esc(p.revision || '')+'">'+esc(s.text)+'</button>'+executionDisclosure(s,p.gh,p,'quick','')+'</td><td>'+stepExecution(s,true)+'</td><td><span class="tag s-'+s.status+'">'+esc(TASK_STATUSES[s.status] || s.status)+'</span></td></tr>';}).join('');}).join('')+'</tbody></table>';

    }).join('')+'</select>';
  }
  var suppressClickUntil = 0;
  function clearDrop() {
    document.querySelectorAll('.drop-target').forEach(function(el){el.classList.remove('drop-target');});
  }
  function endDrag() {
    dragged = null;
    suppressClickUntil = Date.now() + 250;
    clearDrop();
    document.querySelectorAll('.dragging').forEach(function(el){el.classList.remove('dragging');});
  }
  async function savePlanField(k, field, target, revision, stepLine) {
    var p = planByKey(k);
    if (!p || saving) return;
    if (field==='status' && (PLAN_STAGES.indexOf(target)<0 || stage(p.status)===target)) return;
    if(field!=='status')return;
    if (!revision) { showError('Refresh the board before moving this plan.'); return; }
    saving = true;
    $('save-state').textContent = 'Saving…';
    showError('');
    render(true);
    try {
      var body={repo:p.repo,plan:p.name,revision:revision,status:target};
      var response = await fetch('/api/plans/'+field, {method:'POST', headers:{'Content-Type':'application/json','X-Workboard':'1'},
        body:JSON.stringify(body)});
      var result = await response.json();
      if (!response.ok) throw Error(result.error || 'Could not save change.');
      saving = false;
      await get();
      $('save-state').textContent = 'Moved to '+target;
      if(result.error) showError('Status saved. Refresh failed: '+result.error);
    } catch(e) {
      saving = false;
      await get();
      $('save-state').textContent = '';
      showError(e.message);
    } finally {
      saving = false;
      render();
    }
  }
  function moveStatus(k,target,revision){return savePlanField(k,'status',target,revision);}
  function columnInput(target){
    if(!columnMenu)return false;
    if(target.closest('[data-column-plan-search]')){columnMenu.query=target.value;render(true);return true;}
    var date=target.closest('[data-column-date]');
    if(date && columnMenu.column==='updated'){columnMenu.value[date.getAttribute('data-column-date')]=target.value;columnMenu.error='';return true;}
    var field=target.closest('[data-column-field]');
    if(!field)return false;
    if(columnMenu.column==='updated'){
      if(!['all','recorded','missing'].includes(target.value))return true;
      columnMenu.value.mode=target.value;
      if(target.value==='missing'){columnMenu.value.from='';columnMenu.value.to='';}
      render(true);
    }else columnMenu.value=target.value;
    return true;
  }
  document.addEventListener('toggle',function(e){
    if(!e.target.getAttribute)return;var token=e.target.getAttribute('data-plan-disclosure');
    if(!token || e.target.getAttribute('data-disclosure-auto'))return;
    if(ui.planDetails[token]!==!!e.target.open){ui.planDetails[token]=!!e.target.open;save('wb-ui',ui);}
  },true);
  document.addEventListener('input',function(e){columnInput(e.target);});
  document.addEventListener('change',function(e){
    var choice=e.target.closest('[data-column-plan-choice]');
    if(choice && columnMenu && columnMenu.column==='plan'){
      var k=choice.getAttribute('data-column-plan-choice');
      if(columnMenu.value===null)columnMenu.value=plans().map(key);
      columnMenu.value=columnMenu.value.filter(function(v){return v!==k;});
      if(e.target.checked)columnMenu.value.push(k);
      return;
    }
    if(columnInput(e.target))return;
    if(e.target.closest('[data-task-group]')){
      if(!['none','plan'].includes(e.target.value))return;
      ui.taskGroup=e.target.value;columnMenu=null;save('wb-ui',ui);render(true);return;
    }
    if(e.target.closest('[data-agent-filter]')) {ui.agent=e.target.value;save('wb-ui',ui);render(true);return;}
    var select=e.target.closest('[data-status]');
    if(!select) return;
    var p=planByKey(select.getAttribute('data-status'));
    if(p) {
      var target=select.value;
      select.className='status-select status-'+statusTone(target);
      select.disabled=true;
      moveStatus(key(p),target,p.revision).finally(function(){select.disabled=false;});
    }
  });
  document.addEventListener('dragstart',function(e){
    var card=e.target.closest('[data-plan]');
    if(!card || saving || e.target.closest('a,input,select,textarea')) {e.preventDefault();return;}
    var p=planByKey(card.getAttribute('data-plan'));
    if(!p || !p.revision) {e.preventDefault();return;}
    dragged={key:key(p),column:columnOf(p),revision:p.revision};
    e.dataTransfer.effectAllowed='move';
    e.dataTransfer.setData('text/plain',key(p));
    card.classList.add('dragging');
  });
  document.addEventListener('dragover',function(e){
    var column=e.target.closest('[data-column]');
    if(!dragged || saving || !column || Number(column.getAttribute('data-column'))===dragged.column) return;
    e.preventDefault();
    e.dataTransfer.dropEffect='move';
    clearDrop();
    column.classList.add('drop-target');
  });
  document.addEventListener('dragleave',function(e){
    var column=e.target.closest('[data-column]');
    if(column && !column.contains(e.relatedTarget)) column.classList.remove('drop-target');
  });
  document.addEventListener('drop',function(e){
    var column=e.target.closest('[data-column]'), source=dragged;
    if(!source || !column) return;
    e.preventDefault();
    var index=Number(column.getAttribute('data-column'));
    endDrag();
    if(index!==source.column && COLUMN_STAGES[index]) moveStatus(source.key,COLUMN_STAGES[index],source.revision);
    else get();
  });
  document.addEventListener('dragend',function(){endDrag();get();});
  var refreshing=null;
  function refresh() {
    if(refreshing)return refreshing;
    if($('quick-refresh')){$('quick-refresh').disabled=true;$('quick-refresh').textContent='Checking…';}
    $('save-state').textContent='Checking progress…';
    refreshing=(async function(){
      try{
        var response=await fetch('/api/refresh',{method:'POST',cache:'no-store',headers:{'X-Workboard':'1'}});
        var result=response.status===204?{}:await response.json();
        if(!response.ok || result.error)throw Error(result.error || 'Progress refresh failed');
        var latest=await get();
        if(!latest)throw Error('Could not read refreshed progress');
        if(latest.error)throw Error(latest.error);
        $('save-state').textContent='Progress updated';
      }catch(e){showError(e.message);$('save-state').textContent='Progress check failed';}
      finally{refreshing=null;if($('quick-refresh')){$('quick-refresh').disabled=false;$('quick-refresh').textContent='Refresh';}}
    })();
    return refreshing;
  }
  document.addEventListener('pointerdown',function(e){
    if(!columnMenu || e.target.closest('.column-popover,[data-column-menu]'))return;
    var column=columnMenu.column;columnMenu=null;
    var popup=$('task-column-popover'),trigger=$('column-trigger-'+column);
    if(popup)popup.remove();
    if(trigger){trigger.setAttribute('aria-expanded','false');trigger.closest('th').classList.remove('column-open');}
  });
  document.addEventListener('click', function (ev) {
    if(handleUpdateAction(ev))return;
    if(Date.now()<suppressClickUntil) return;
    if(handleViewAction(ev)) return;
    var go = ev.target.closest('[data-go]'), tab = ev.target.closest('[data-tab]');
    if (Date.now() < suppressClickUntil || ev.target.closest('a,select')) return;
    if (go) { columnMenu=null;var v = go.getAttribute('data-go'); if(v==='waiting' && ui.view==='waiting')v='home'; if (v !== ui.view) { ui.view = v; ui.q = ''; ui.activityDay='';ui.focusTask=null;if(v==='waiting' && ui.layout==='list')ui.taskStatus='all'; if (v.indexOf('plan:') === 0) ui.tab = 'summary'; } save('wb-ui', ui); render(); $('view').scrollTop = 0; }
    else if (tab) { ui.tab = tab.getAttribute('data-tab'); save('wb-ui', ui); render(); }
  });

  function showError(reason) {
    $('error').hidden = !reason; $('error').textContent = reason || ''; $('error').title = reason || '';
    if($('quick-error')){$('quick-error').hidden=!reason;$('quick-error').textContent=reason || '';}
  }

  var updateUI={state:null,open:false,dismissed:'',returnTo:null,requesting:false,action:''};
  function updateInstalling(){return updateUI.requesting && updateUI.action==='apply' || updateUI.state && ['downloading','verifying','installing'].includes(updateUI.state.phase);}
  function renderUpdate(){
    var s=updateUI.state || {},button=$('update-launcher'),host=$('update-content');
    if(button){button.className='btn update-launcher'+(s.available && !s.skipped?' has-update':'');button.textContent=s.available && !s.skipped?'Update available':'Updates';button.title=s.current?'Installed '+s.current:'Software updates';}
    if(!host || !updateUI.open)return;
    var active=document.activeElement && document.activeElement.id,busy=updateInstalling(),checking=s.phase==='checking' || updateUI.requesting;
    var title=s.available?'Update available':'Software update',message={checking:'Checking the private GitHub release...',downloading:'Downloading the update...',verifying:'Verifying the package and version...',installing:'Installing and restarting... This window will reload automatically.'}[s.phase];
    host.innerHTML='<div class="update-shell"><header class="update-header"><img src="/icons/app.png" alt=""><h2 id="update-title">'+title+'</h2><button class="icon-btn" id="update-close" data-update-close aria-label="Close update dialog"'+(busy?' disabled':'')+'>'+icon('close')+'</button></header><div class="update-body"><p class="update-version">'+esc(s.available?s.latest:s.current || 'Agent Ops')+'</p><p class="update-current">'+esc(s.available?'Current version '+s.current+'. A new version is available.':s.current?'Current version '+s.current+'.':'Check for a newer version of Agent Ops.')+'</p>'+(s.error?'<p class="update-error" role="alert">'+esc(s.error)+'</p>':'')+(message?'<p class="update-progress" role="status">'+esc(message)+'</p>':'')+(!message && !s.error && !s.available && s.checkedAt?'<p>Agent Ops is up to date.</p>':'')+(s.available?'<div class="update-whats-new"><strong>What\'s new</strong><div class="update-notes">'+esc(s.notes || 'No release notes provided.')+'</div></div>':'')+'</div><footer class="update-footer"><small>Task data and preferences are preserved.</small><button class="btn" data-update-close'+(busy?' disabled':'')+'>'+(s.available?'Cancel':'Close')+'</button>'+(s.available?'<button class="btn" id="update-skip" data-update-action="skip"'+(busy || checking?' disabled':'')+'>Skip this version</button><button class="btn update-primary" id="update-apply" data-update-action="apply"'+(busy || checking || saving?' disabled':'')+'>Update now</button>':'<button class="btn update-primary" id="update-check" data-update-action="check"'+(busy || checking?' disabled':'')+'>Check for updates</button>')+'</footer></div>';
    if(active && $(active) && !$(active).disabled)$(active).focus({preventScroll:true});
  }
  function openUpdateDialog(){
    var dialog=$('update-dialog');if(!dialog)return;
    if(!updateUI.open)updateUI.returnTo=document.activeElement;
    updateUI.open=true;renderUpdate();if(!dialog.open)dialog.showModal();
    if($('update-close'))$('update-close').focus();
  }
  function closeUpdateDialog(){
    if(updateInstalling())return;
    updateUI.open=false;updateUI.dismissed=updateUI.state && updateUI.state.latest || '';
    if($('update-dialog') && $('update-dialog').open)$('update-dialog').close();
    if(updateUI.returnTo && updateUI.returnTo.isConnected)updateUI.returnTo.focus({preventScroll:true});
  }
  function receiveUpdate(s){
    updateUI.state=s;renderUpdate();
    if(s.phase==='available' && s.available && !s.skipped && updateUI.dismissed!==s.latest && !quick.key && !updateUI.open)openUpdateDialog();
  }
  async function pollUpdates(){
    try{var response=await fetch('/api/updates',{cache:'no-store'});if(!response.ok)throw Error('Could not read update status.');receiveUpdate(await response.json());}
    catch(e){if(updateInstalling())return;if(updateUI.open){updateUI.state=Object.assign({},updateUI.state,{error:e.message});renderUpdate();}}
  }
  async function updateAction(action){
    if(updateUI.requesting || updateInstalling() || (action==='apply' && saving))return;
    updateUI.action=action;updateUI.requesting=true;renderUpdate();
    try{
      var response=await fetch('/api/updates/'+action,{method:'POST',headers:{'X-Workboard':'1','Content-Type':'application/json'},body:JSON.stringify({version:updateUI.state && updateUI.state.latest || ''})});
      var state=await response.json();if(!response.ok)throw Error(state.error || 'Update request failed.');
      receiveUpdate(state);if(action==='skip')closeUpdateDialog();
    }catch(e){updateUI.state=Object.assign({},updateUI.state,{error:e.message});}
    finally{updateUI.requesting=false;updateUI.action='';renderUpdate();}
  }
  function handleUpdateAction(ev){
    if(ev.target.closest('[data-update-open]')){openUpdateDialog();pollUpdates();return true;}
    if(ev.target.closest('[data-update-close]')){closeUpdateDialog();return true;}
    var action=ev.target.closest('[data-update-action]');if(action){updateAction(action.getAttribute('data-update-action'));return true;}return false;
  }
  function initUpdates(){
    if($('update-dialog'))$('update-dialog').addEventListener('cancel',function(e){e.preventDefault();closeUpdateDialog();});
    pollUpdates();setInterval(function(){if(updateUI.open || updateInstalling() || updateUI.state && updateUI.state.phase==='checking')pollUpdates();},1000);
    setInterval(pollUpdates,30000);
  }
  function restoreUpdateView(j){
    var saved=load('wb-update-view',{});
    if(saved.version!==j.appVersion || !saved.ui)return null;
    Object.assign(ui,saved.ui);save('wb-update-view',{});return saved;
  }

  function connection(online) { $('live').className = online ? 'live' : 'live off'; $('connection').textContent = online ? '' : 'Reconnecting…'; }
  function get() { if(dragged || saving) return Promise.resolve(); return fetch('/api/state', { cache: 'no-store' }).then(function (r) { if(!r.ok) throw Error('State request failed: '+r.status); return r.json(); }).then(function (j) {
    if (dragged || saving) return;
    if (!j.state || !Array.isArray(j.state.plans) || !Array.isArray(j.activity)) throw Error(j.error || 'Invalid state response');
    if(D.appVersion && j.appVersion && D.appVersion!==j.appVersion){save('wb-update-view',{version:j.appVersion,ui:ui,scroll:$('view').scrollTop,horizontal:$('view').scrollLeft,quick:{key:quick.key,tab:quick.tab,sequence:quick.sequence,scroll:$('quick-plan-scroll') && $('quick-plan-scroll').scrollTop}});location.reload();return j;}
    var restored=restoreUpdateView(j);
    D = j; showError(D.error); render();
    if(restored){$('view').scrollTop=restored.scroll || 0;$('view').scrollLeft=restored.horizontal || 0;if(restored.quick && restored.quick.key && planByKey(restored.quick.key)){openQuickPlan(restored.quick.key,restored.quick.sequence);quick.tab=restored.quick.tab;renderQuickPlan(true);if($('quick-plan-scroll'))$('quick-plan-scroll').scrollTop=restored.quick.scroll || 0;}}
    return j;
  }).catch(function (e) { if(!updateInstalling())showError(e.message);return null; }); }
  function connect() {
    var es = new EventSource('/events');
    es.onopen = function () { connection(true); get(); };
    es.onmessage = function () { get(); };
    es.onerror = function () { connection(false); };
  }
  function jumpHash() {
    if (location.hash.indexOf('#plan=') === 0) {
      try { ui.view = 'plan:' + decodeURIComponent(location.hash.slice(6).replace(/\+/g, ' ')); ui.tab = 'summary'; ui.q = ''; save('wb-ui',ui); } catch(e) { /* An invalid external fragment leaves the current view intact. */ }
    }
  }
  window.addEventListener('hashchange',function(){jumpHash();render();});
  if($('quick-plan'))$('quick-plan').addEventListener('cancel',function(e){e.preventDefault();closeQuickPlan();});
  document.addEventListener('keydown',function(e){
    if(updateUI.open){if(e.key==='Escape'){e.preventDefault();closeUpdateDialog();}return;}
    if(e.key==='F5'){e.preventDefault();if(!e.repeat)refresh();return;}
    if(quick.key){
      if(e.key==='Escape'){e.preventDefault();closeQuickPlan();return;}
      if(e.ctrlKey && e.key.toLowerCase()==='k'){e.preventDefault();if($('quick-plan-scroll'))$('quick-plan-scroll').focus();return;}
      if(e.altKey && ['ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();stepQuickPlan(e.key==='ArrowDown'?1:-1);return;}
      var tab=e.target.closest && e.target.closest('[data-quick-tab]');
      if(tab && ['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){
        e.preventDefault();var tabs=['overview','checklist','activity'],i=tabs.indexOf(quick.tab);
        quick.tab=tabs[e.key==='Home'?0:e.key==='End'?2:(i+(e.key==='ArrowRight'?1:-1)+3)%3];renderQuickPlan(true);if($('quick-tab-'+quick.tab))$('quick-tab-'+quick.tab).focus();return;
      }
    }
    if(e.key==='Escape' && columnMenu){e.preventDefault();dismissColumnMenu(true);return;}
    if(e.key==='Enter' && columnMenu && e.target.tagName==='INPUT' && e.target.type!=='checkbox'){e.preventDefault();applyColumnMenu();return;}
    var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
    if (e.ctrlKey && e.key.toLowerCase()==='k') {e.preventDefault(); if($('q')) {$('q').focus();$('q').select();} return;}
    if (e.key==='Escape' && ui.view.indexOf('plan:')===0) {ui.view='home';ui.q='';ui.activityDay='';save('wb-ui',ui);render();return;}
    if (typing) return;
    if (e.altKey && (e.key==='ArrowUp' || e.key==='ArrowDown')) {
      e.preventDefault(); var ps=plans(), i=ps.findIndex(function(p){return ui.view==='plan:'+key(p);});
      if(ps.length) {i=(i+(e.key==='ArrowDown'?1:-1)+ps.length)%ps.length;ui.view='plan:'+key(ps[i]);ui.q='';ui.tab='summary';save('wb-ui',ui);render();$('view').scrollTop=0;}
    } else if (!e.ctrlKey && !e.altKey && !e.metaKey && e.key.toLowerCase()==='r') { e.preventDefault();refresh(); }
  });
  jumpHash(); get(); connect(); initUpdates();
  setInterval(get, 30000); // server owns the same stale rule used by toasts
})();
</script>
