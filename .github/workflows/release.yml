name: Release draft (Electron)
# Pushing a vX.Y.Z tag on main runs every check, builds the NSIS installer,
# smoke-tests the unpacked app and creates a DRAFT GitHub release with the
# installer, latest.yml, the blockmap and the CHANGELOG.md notes. The owner
# reviews the draft and publishes it; installed apps only see published
# releases. The tag must equal package.json "version".
# Run by hand (workflow_dispatch) on any branch for a dry run: it packages a
# dev version (<version>-dev.<run>) and publishes nothing.
# Least privilege: the build job, which installs packages and runs the build
# and the app, holds only a read token that is not kept in .git/config. Only
# the publish job holds contents: write, and it runs no repository code.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-electron-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Version from the tag, checked against package.json
        id: version
        shell: pwsh
        run: |
          $version = node scripts/release/version.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Version check failed.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "Packaging $version"
      - name: Tag is on main and has release notes
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag $env:TAG is not on main." }
          node scripts/release/notes.mjs $env:TAG dist/electron/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release notes missing.' }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - name: Package the installer
        run: npm run package
      - name: Smoke-test the unpacked packaged app
        run: npm run smoke:packaged
      - name: Installer, latest.yml and blockmap agree
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $exe = "dist/electron/agent-ops-setup-$env:VERSION.exe"
          foreach ($f in @($exe, "$exe.blockmap", 'dist/electron/latest.yml')) { if (!(Test-Path -LiteralPath $f)) { throw "$f is missing." } }
          $yml = Get-Content -LiteralPath dist/electron/latest.yml -Raw
          if ($yml -notmatch "(?m)^version: $([regex]::Escape($env:VERSION))\s*$") { throw 'latest.yml has another version.' }
          $hash = [Convert]::ToBase64String([Security.Cryptography.SHA512]::Create().ComputeHash([IO.File]::ReadAllBytes((Resolve-Path $exe))))
          if ($yml -notmatch [regex]::Escape("sha512: $hash")) { throw 'latest.yml does not match the installer.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/electron/agent-ops-setup-*.exe
            dist/electron/agent-ops-setup-*.exe.blockmap
            dist/electron/latest.yml
            dist/electron/release-notes.md
  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-assets
          path: assets
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd assets
          exe="agent-ops-setup-${VERSION}.exe"
          # The files crossed jobs; check the installer still matches latest.yml.
          hash="$(openssl dgst -sha512 -binary "$exe" | base64 -w0)"
          grep -qxF "sha512: ${hash}" latest.yml
          grep -qxF "version: ${VERSION}" latest.yml
          gh release create "$TAG" --repo "$REPO" --draft --verify-tag --title "Agent Ops $TAG" --notes-file release-notes.md \
            "$exe" "$exe.blockmap" latest.yml
