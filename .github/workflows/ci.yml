name: Windows build and audit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Tests, vet and vulnerability scan
        shell: pwsh
        run: ./scripts/test.ps1 -VulnerabilityScan
      - name: Build package and verify native icons
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Isolated release install and HTTP smoke
        run: node scripts/smoke.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-ops-windows-amd64
          path: |
            dist/agent-ops-windows-amd64.zip
            dist/agent-ops-windows-amd64.zip.sha256
          if-no-files-found: error
